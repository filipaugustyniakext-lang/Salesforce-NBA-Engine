<!--
  mainBanner — upload this file as the Template Shell for the Banner channel.
  views="mobile" limits preview to the phone frame in Template Studio and Copy Center.
  Use views="desktop", views="mobile", or views="desktop,mobile".
  Placeholders: {{title}} {{description}} {{imageUrl}} {{legalLabel}} {{legalNote}} {{buttonLabel}}
  Optional parts use data-variant and data-variant-label. The shell stays complete; CSS reacts to
  .cc-preview[data-cc-variant-<name>="off"]. legalNote and secondaryButton are optional. The primary button stays.
-->
<cc-preview data-action="template-start" template-kind="single" views="mobile" mobile-width="375" mobile-height="812" desktop-width="375">
<style>
  .main-banner-screen {
    box-sizing: border-box;
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: auto;
    height: auto;
    padding: 3rem 20px;
    background: transparent;
    overflow: hidden;
    font-family: 'UniCredit', Arial, Helvetica, sans-serif;
  }
  .main-banner {
    position: relative;
    box-sizing: border-box;
    flex: 0 0 auto;
    width: 100%;
    min-height: 180px;
    padding: 16px 16px 14px;
    border-radius: 16px;
    overflow: hidden;
    color: #ffffff;
    background: rgb(0, 45, 54);
  }
  .main-banner::before,
  .main-banner::after {
    content: "";
    width: 88.78px;
    height: 98.9px;
    position: absolute;
    opacity: 0.1;
    filter: blur(22px);
    transform: rotate(45deg);
    background: white;
    border-radius: 50px;
    pointer-events: none;
  }
  .main-banner::before {
    top: 15%;
    left: -17%;
  }
  .main-banner::after {
    top: 23%;
    right: -7%;
  }
  .main-banner__close {
    position: absolute;
    z-index: 2;
    top: 7px;
    right: 12px;
    width: 10.6px;
    height: 10.6px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #ffffff;
    font-size: 20px;
    line-height: 20px;
    cursor: pointer;
  }
  .main-banner__top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .main-banner__copy {
    flex: 1 1 auto;
    min-width: 0;
    padding-right: 4px;
  }
  .main-banner__title {
    margin: 0 0 6px;
    font-size: 16px;
    line-height: 22px;
    font-weight: 700;
    color: #ffffff;
  }
  .main-banner__description {
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 18px;
    font-weight: 400;
    color: #ffffff;
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .main-banner__legal {
    display: inline-block;
    margin: 0 0 12px;
    padding: 0;
    border: 0;
    background: transparent;
    font-size: 14px;
    line-height: 32px;
    font-weight: 400;
    color: #ffffff;
    text-decoration: underline;
    cursor: pointer;
  }
  .main-banner-drawer-overlay {
    position: absolute;
    top: -12px;
    right: -20px;
    bottom: -12px;
    left: -20px;
    z-index: 20;
    background: transparent;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .main-banner-drawer-overlay.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .main-banner-drawer-backdrop {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: rgba(0, 0, 0, 0.45);
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .main-banner-drawer-overlay.is-open .main-banner-drawer-backdrop {
    opacity: 1;
  }
  .cc-preview .main-banner-drawer,
  .main-banner-drawer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    flex: 0 1 auto;
    max-height: 66%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(100%);
    background: rgb(0, 45, 54);
    color: #ffffff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.28);
    transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .main-banner-drawer-overlay.is-open .main-banner-drawer {
    transform: translateY(0);
  }
  .main-banner-drawer__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 8px;
  }
  .main-banner-drawer__title {
    margin: 0;
    font-size: 18px;
    line-height: 24px;
    font-weight: 700;
  }
  .main-banner-drawer__close {
    border: 0;
    background: transparent;
    color: #ffffff;
    font-size: 20px;
    line-height: 20px;
    cursor: pointer;
  }
  .main-banner-drawer__body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 0 10px 16px 16px;
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.35) transparent;
  }
  .main-banner-drawer__body::-webkit-scrollbar {
    width: 4px;
  }
  .main-banner-drawer__body::-webkit-scrollbar-track {
    background: transparent;
  }
  .main-banner-drawer__body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.35);
    border-radius: 4px;
  }
  .main-banner__image {
    flex: 0 0 100px;
    width: 100px;
    height: 100px;
    border-radius: 4px;
    background-color: #c8c8c8;
    background-image:
      linear-gradient(45deg, #bdbdbd 25%, transparent 25%),
      linear-gradient(-45deg, #bdbdbd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #bdbdbd 75%),
      linear-gradient(-45deg, transparent 75%, #bdbdbd 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    overflow: hidden;
  }
  .main-banner__image img {
    display: block;
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 4px;
    background: #c8c8c8;
  }
  .main-banner__actions {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 8px;
    width: 100%;
    margin-top: 20px;
  }
  .main-banner__btn {
    box-sizing: border-box;
    flex: 1 1 0;
    min-width: 0;
    height: 32px;
    border-radius: 48px;
    padding: 8px 16px;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    line-height: 16px;
    font-weight: 700;
  }
  .main-banner__btn_primary {
    border: solid 1px #E7F8FB;
    background: #E7F8FB;
    color: #002D36;
  }
  .main-banner__btn_secondary {
    border: solid 1px #E7F8FB;
    background: transparent;
    color: #E7F8FB;
  }
  @media (prefers-color-scheme: dark) {
    .main-banner {
      background: rgb(33, 0, 4);
    }
    .main-banner-drawer {
      background: rgb(33, 0, 4);
    }
    .main-banner__btn_primary {
      border-width: 1px;
      border-color: #7A1A12;
      background: #7A1A12;
      color: #ffffff;
    }
    .main-banner__btn_secondary {
      border-width: 1px;
      border-color: #909090;
      background: transparent;
      color: #CCCCCC;
    }
  }
  /* Configurations are declared with data-variant. The preview sets data-cc-variant-<name>="off" on .cc-preview. */
  .cc-preview[data-cc-variant-legalnote="off"] .main-banner__legal,
  .cc-preview[data-cc-variant-legalnote="off"] .main-banner-drawer-overlay {
    display: none;
  }
  .cc-preview[data-cc-variant-secondarybutton="off"] .main-banner__btn_secondary {
    display: none;
  }
  .cc-preview[data-cc-variant-secondarybutton="off"] .main-banner__btn_primary {
    flex: 1 1 100%;
    width: 100%;
  }
</style>
<cc-preview region="fixed-edit">
  <div class="main-banner-screen">
    <article class="main-banner">
      <button type="button" class="main-banner__close" aria-label="Close">×</button>
      <div class="main-banner__top">
        <div class="main-banner__copy">
          <h2 class="main-banner__title" data-editor="text">{{title}}</h2>
          <p class="main-banner__description" data-editor="text">{{description}}</p>
          <button type="button" class="main-banner__legal" data-editor="text" data-variant="legalNote" data-variant-label="Legal note" data-drawer-open="legal">{{legalLabel}}</button>
        </div>
        <div class="main-banner__image">
          <img data-editor="image" alt="" src="{{imageUrl}}" width="100" height="100" />
        </div>
      </div>
      <div class="main-banner__actions">
        <a class="main-banner__btn main-banner__btn_secondary" data-editor="action" data-variant="secondaryButton" data-variant-label="Secondary button" href="{{secondaryUrl}}">{{buttonLabel}}</a>
        <a class="main-banner__btn main-banner__btn_primary" data-editor="action" href="{{primaryUrl}}">{{buttonLabel}}</a>
      </div>
    </article>
    <div class="main-banner-drawer-overlay" data-drawer-overlay="legal" data-variant="legalNote" aria-hidden="true">
      <button type="button" class="main-banner-drawer-backdrop" data-drawer-close aria-label="Close legal note"></button>
      <section class="main-banner-drawer" data-drawer="legal" aria-label="Legal note">
        <div class="main-banner-drawer__header">
          <h3 class="main-banner-drawer__title">{{legalNote}}</h3>
          <button type="button" class="main-banner-drawer__close" data-drawer-close aria-label="Close">×</button>
        </div>
        <div class="main-banner-drawer__body" data-editor="richtext">{{legalNote}}</div>
      </section>
    </div>
  </div>
</cc-preview>
</cc-preview>
