<template>
    <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Processing..." size="small" variant="brand"></lightning-spinner>
    </template>

    <!-- Action buttons — only shown when offer is in a state that allows transitions -->
    <div class="action-strip">
        <!-- Deactivate: shown when offer is Active -->
        <template lwc:if={showDeactivate}>
            <lightning-button
                label="Deactivate"
                variant="neutral"
                icon-name="utility:ban"
                onclick={handleDeactivateClick}
                class="slds-m-right_x-small">
            </lightning-button>
        </template>

        <!-- Decommission: shown when offer is not already Decommissioned -->
        <template lwc:if={showDecommission}>
            <lightning-button
                label="Decommission"
                variant="destructive-text"
                icon-name="utility:error"
                onclick={handleDecommissionClick}>
            </lightning-button>
        </template>
    </div>

    <!-- Deactivate confirmation modal -->
    <template lwc:if={showDeactivateModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open" aria-modal="true">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <lightning-icon icon-name="utility:warning" size="small" variant="warning" class="slds-m-right_small"></lightning-icon>
                    <h2 class="slds-modal__title">Deactivate Offer?</h2>
                    <button class="slds-button slds-button_icon slds-modal__close" onclick={handleDeactivateCancel} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Setting this offer to <strong>Inactive</strong> will mean it is <strong>no longer selected for any campaign activations</strong>, even though one of its versions remains Active.</p>
                    <p class="slds-m-top_small">The current Active version will be moved to <strong>Ready</strong> status and can be reactivated at any time.</p>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleDeactivateCancel}></lightning-button>
                    <lightning-button label="Deactivate" variant="brand" onclick={handleDeactivateConfirm} class="slds-m-left_small"></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Decommission confirmation modal -->
    <template lwc:if={showDecommissionModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open" aria-modal="true">
            <div class="slds-modal__container">
                <div class="slds-modal__header slds-theme_error">
                    <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_small"></lightning-icon>
                    <h2 class="slds-modal__title">Decommission Offer?</h2>
                    <button class="slds-button slds-button_icon slds-modal__close" onclick={handleDecommissionCancel} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error" class="slds-m-right_x-small"></lightning-icon>
                        <strong>This action is irreversible.</strong>
                    </div>
                    <p>Decommissioning this offer will:</p>
                    <ul class="slds-list_dotted slds-m-top_small slds-m-left_medium">
                        <li>Permanently deactivate <strong>all versions</strong> of this offer</li>
                        <li>Prevent any new versions from being created</li>
                        <li>Prevent any existing versions from being reactivated</li>
                        <li>Remove this offer from all future campaign activations</li>
                    </ul>
                    <p class="slds-m-top_medium">To use this offer again in future, you would need to create an entirely <strong>new Offer record</strong>.</p>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleDecommissionCancel}></lightning-button>
                    <lightning-button label="Decommission Permanently" variant="destructive" onclick={handleDecommissionConfirm} class="slds-m-left_small"></lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
