<template>
    <template lwc:if={hasGroup}>
        <div class="cc-marker">
            <div class="cc-marker__header">
                <div>
                    <h3 class="slds-text-heading_small">{group.count} neighbouring elements selected</h3>
                    <p class="slds-text-body_small slds-text-color_weak">Inside {group.parentLabel}</p>
                </div>
                <lightning-button-icon icon-name="utility:close" variant="bare" alternative-text="Clear selection" title="Clear selection" onclick={handleClose}></lightning-button-icon>
            </div>
            <div class="cc-marker__children">
                <template for:each={groupLabels} for:item="item">
                    <span key={item.key} class="cc-marker__crumb cc-marker__crumb_current">{item.label}</span>
                </template>
            </div>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Shift-click another element to change the selection, or click one element to start again.</p>
            <template lwc:if={groupProblem}>
                <div class="slds-notify slds-notify_alert slds-alert_warning cc-marker__alert" role="status">{groupProblem}</div>
            </template>
            <template lwc:else>
                <div class="cc-marker__form">
                    <lightning-radio-group label="Treat them as one region" options={groupRegionOptions} value={groupDraft.regionKind} data-field="regionKind" onchange={handleGroupField}></lightning-radio-group>
                    <lightning-input label="Region id (optional)" value={groupDraft.id} data-field="id" placeholder="Generated when empty, e.g. footer" onchange={handleGroupField}></lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak">{wrapperNote}</p>
                </div>
            </template>
            <template lwc:if={hasErrors}>
                <div class="slds-notify slds-notify_alert slds-alert_error cc-marker__alert" role="alert">
                    <ul class="slds-list_dotted slds-text-align_left">
                        <template for:each={errorItems} for:item="item"><li key={item.key}>{item.message}</li></template>
                    </ul>
                </div>
            </template>
            <div class="cc-marker__actions">
                <lightning-button label="Clear selection" onclick={handleClose}></lightning-button>
                <lightning-button label="Wrap in region" variant="brand" disabled={wrapDisabled} onclick={handleWrap}></lightning-button>
            </div>
        </div>
    </template>
    <template lwc:elseif={hasInfo}>
        <div class="cc-marker">
            <div class="cc-marker__header">
                <div>
                    <h3 class="slds-text-heading_small">{heading}</h3>
                    <p class="slds-text-body_small slds-text-color_weak">{snippet}</p>
                </div>
                <lightning-button-icon icon-name="utility:close" variant="bare" alternative-text="Close" title="Close" onclick={handleClose}></lightning-button-icon>
            </div>

            <nav class="cc-marker__path" aria-label="Element path">
                <span class="slds-text-body_small slds-text-color_weak">Path:</span>
                <template for:each={path} for:item="crumb">
                    <button key={crumb.key} class={crumb.className} type="button" data-node={crumb.node} disabled={crumb.current} onclick={handlePick}>{crumb.label}</button>
                </template>
            </nav>
            <template lwc:if={hasChildren}>
                <div class="cc-marker__children">
                    <span class="slds-text-body_small slds-text-color_weak">Inside:</span>
                    <template for:each={children} for:item="child">
                        <button key={child.key} class="cc-marker__crumb" type="button" data-node={child.node} onclick={handlePick}>{child.label}</button>
                    </template>
                    <template lwc:if={canGroupChildren}>
                        <button class="cc-marker__crumb cc-marker__crumb_action" type="button" onclick={handleGroupChildren}>Group all children</button>
                    </template>
                </div>
            </template>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Picked the wrong element? Choose a parent from the path or a child from "Inside", or click another element in the preview. Shift-click adds neighbouring elements to the selection.</p>

            <template lwc:if={suggestionText}>
                <div class="cc-marker__suggestion slds-text-body_small">{suggestionText}</div>
            </template>

            <lightning-radio-group class="slds-m-top_small" label="What is this element?" type="button" options={roleOptions} value={draft.role} onchange={handleRole}></lightning-radio-group>

            <template lwc:if={isSection}>
                <div class="cc-marker__form">
                    <lightning-combobox label="Section level" options={levelOptions} value={draft.level} onchange={handleLevel} field-level-help="Container > Row > Column. Content goes inside columns."></lightning-combobox>
                    <p class="slds-text-body_small slds-text-color_weak">{levelHelp}</p>
                    <lightning-checkbox-group label="Settings marketers can change" options={bindOptions} value={draft.binds} onchange={handleBinds}></lightning-checkbox-group>
                    <lightning-input label="Id (optional)" value={draft.id} data-field="id" placeholder="Generated when empty" field-level-help="A stable name for this section. Set it if you reorder sections later." onchange={handleField}></lightning-input>
                    <lightning-input label="Label (optional)" value={draft.label} data-field="label" onchange={handleField}></lightning-input>
                </div>
            </template>

            <template lwc:if={isContent}>
                <div class="cc-marker__form">
                    <lightning-combobox label="Content type" options={contentOptions} value={draft.contentType} onchange={handleContentType}></lightning-combobox>
                    <template lwc:if={tagWarning}>
                        <div class="slds-text-color_error slds-text-body_small">{tagWarning}</div>
                    </template>
                    <lightning-input label="Binding key" required value={draft.key} data-field="key" field-level-help="Unique name of this content in the file, e.g. headline or heroImage." onchange={handleField}></lightning-input>
                    <template lwc:if={keyWarning}>
                        <div class="slds-text-color_error slds-text-body_small">{keyWarning}</div>
                    </template>
                    <template lwc:if={contentWarning}>
                        <div class="slds-text-color_error slds-text-body_small">{contentWarning}</div>
                    </template>
                    <lightning-input label="Label shown to marketers (optional)" value={draft.label} data-field="label" onchange={handleField}></lightning-input>
                    <template lwc:if={usesComplexity}>
                        <lightning-combobox label="Rich text editor level" options={complexityOptions} value={draft.complexity} data-field="complexity" onchange={handleField}></lightning-combobox>
                    </template>
                </div>
            </template>

            <template lwc:if={isRegion}>
                <div class="cc-marker__form">
                    <lightning-radio-group label="Region type" options={regionOptions} value={draft.regionKind} data-field="regionKind" onchange={handleField}></lightning-radio-group>
                    <p class="slds-text-body_small slds-text-color_weak">In the preview, a blocks zone shows a placeholder instead of its original content.</p>
                    <lightning-input label="Id (optional)" value={draft.id} data-field="id" placeholder="Generated when empty" onchange={handleField}></lightning-input>
                </div>
            </template>

            <template lwc:if={hasErrors}>
                <div class="slds-notify slds-notify_alert slds-alert_error cc-marker__alert" role="alert">
                    <ul class="slds-list_dotted slds-text-align_left">
                        <template for:each={errorItems} for:item="item"><li key={item.key}>{item.message}</li></template>
                    </ul>
                </div>
            </template>

            <template lwc:if={showZone}>
                <div class="cc-marker__zone">
                    <h4 class="slds-text-title_bold">Blocks zone</h4>
                    <p class="slds-text-body_small slds-text-color_weak">{zoneHelp}</p>
                    <lightning-radio-group label="Position" variant="label-hidden" options={zonePositions} value={zonePosition} onchange={handleZonePosition}></lightning-radio-group>
                    <lightning-button label={zoneLabel} icon-name="utility:drag_and_drop" onclick={handleInsertZone}></lightning-button>
                </div>
            </template>

            <div class="cc-marker__actions">
                <template lwc:if={isMarked}>
                    <lightning-button label="Remove marking" variant="destructive-text" onclick={handleRemove}></lightning-button>
                </template>
                <lightning-button label="Cancel" onclick={handleClose}></lightning-button>
                <lightning-button label={applyLabel} variant="brand" disabled={applyDisabled} onclick={handleApply}></lightning-button>
            </div>
        </div>
    </template>
</template>
