<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="add-modal-title" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container add-modal-container">

            <!-- Header -->
            <header class="slds-modal__header">
                <lightning-icon icon-name="utility:add" size="small" class="slds-m-right_x-small add-modal-header-icon"></lightning-icon>
                <h2 id="add-modal-title" class="slds-modal__title">{modalTitle}</h2>
            </header>

            <!-- Body -->
            <div class="slds-modal__content slds-p-around_medium">

                <!-- ── Section: Message Name ───────────────────────────────── -->
                <div class="add-modal-fields">
                    <div class="add-modal-field-full">
                        <div class="add-modal-name-row">
                            <lightning-input
                                label="Channel Prefix"
                                value={channelPrefix}
                                class="add-modal-field-prefix"
                                disabled
                            ></lightning-input>
                            <lightning-combobox
                                label="Locale"
                                placeholder="Select locale…"
                                value={localeToken}
                                options={localeOptions}
                                required
                                disabled={isLocaleLocked}
                                field-level-help={localeHelp}
                                onchange={handleLocaleChange}
                                class="add-modal-field-locale"
                            ></lightning-combobox>
                            <lightning-input
                                label="Message Name"
                                placeholder="CashLoan_Welcome"
                                value={messageName}
                                class="add-modal-name-part"
                                required
                                onkeyup={handleMessageNameChange}
                                onchange={handleMessageNameChange}
                            ></lightning-input>
                            <lightning-input
                                label="Variant"
                                value={versionDisplay}
                                class="add-modal-field-variant"
                                disabled
                                field-level-help={variantHint}
                            ></lightning-input>
                        </div>
                        <template lwc:if={localesLoading}>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Loading locales…</p>
                        </template>
                        <template lwc:if={hasDuplicateVariant}>
                            <div class="add-modal-version-error slds-m-top_x-small">
                                <lightning-icon icon-name="utility:warning" size="xx-small" class="slds-m-right_xx-small add-modal-icon-warn"></lightning-icon>
                                {versionError}
                            </div>
                        </template>
                    </div>
                </div>

                <template lwc:if={showSourceTemplatePicker}>
                    <div class="add-modal-section-divider"></div>
                    <div class="add-modal-section-header">
                        <h3 class="add-modal-section-title">
                            Product &amp; Template
                            <abbr class="slds-required" title="required">*</abbr>
                        </h3>
                    </div>
                    <div class="add-modal-two-col">
                        <div class="add-modal-two-col__col">
                            <lightning-combobox
                                label="Source Template"
                                placeholder="Select a validated template…"
                                value={sourceTemplateId}
                                options={templateOptions}
                                required
                                disabled={templatesLoading}
                                field-level-help="Active, validated templates for this channel. The editor preview uses this shell."
                                onchange={handleSourceTemplateChange}>
                            </lightning-combobox>
                            <template lwc:if={templatesLoading}>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Loading templates…</p>
                            </template>
                            <template lwc:if={showMissingTemplate}>
                                <p class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">
                                    No active validated template is available for this channel.
                                </p>
                            </template>
                        </div>
                        <div class="add-modal-two-col__col">
                            <template lwc:if={isFamiliesLoading}>
                                <div class="add-modal-offers-loading">
                                    <lightning-spinner size="x-small" alternative-text="Loading families..." variant="brand"></lightning-spinner>
                                    <span class="slds-text-body_small slds-m-left_x-small">Loading product families…</span>
                                </div>
                            </template>
                            <template lwc:else>
                                <lightning-combobox
                                    label="Product Family"
                                    placeholder="Select a product family…"
                                    value={productFamilyId}
                                    options={familyOptions}
                                    required
                                    onchange={handleFamilyChange}
                                ></lightning-combobox>
                            </template>
                            <template lwc:if={showOfferSection}>
                                <div class="slds-m-top_small">
                                    <template lwc:if={isLoadingOffers}>
                                        <div class="add-modal-offers-loading">
                                            <lightning-spinner size="x-small" alternative-text="Loading offers..." variant="brand"></lightning-spinner>
                                            <span class="slds-text-body_small slds-m-left_x-small">Loading offers…</span>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <lightning-combobox
                                            label="Offer (optional)"
                                            placeholder="Select an active offer…"
                                            value={offerId}
                                            options={offerOptions}
                                            onchange={handleOfferChange}
                                        ></lightning-combobox>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template lwc:else>
                    <!-- Product only when template tiles drive source template -->
                    <div class="add-modal-section-divider"></div>
                    <div class="add-modal-section-header">
                        <h3 class="add-modal-section-title">
                            Product
                            <abbr class="slds-required" title="required">*</abbr>
                        </h3>
                    </div>
                    <div class="add-modal-fields">
                        <div class="add-modal-field-full">
                            <template lwc:if={isFamiliesLoading}>
                                <div class="add-modal-offers-loading">
                                    <lightning-spinner size="x-small" alternative-text="Loading families..." variant="brand"></lightning-spinner>
                                    <span class="slds-text-body_small slds-m-left_x-small">Loading product families…</span>
                                </div>
                            </template>
                            <template lwc:else>
                                <lightning-combobox
                                    label="Product Family"
                                    placeholder="Select a product family…"
                                    value={productFamilyId}
                                    options={familyOptions}
                                    required
                                    onchange={handleFamilyChange}
                                ></lightning-combobox>
                            </template>
                        </div>
                        <template lwc:if={showOfferSection}>
                            <div class="add-modal-field-full">
                                <template lwc:if={isLoadingOffers}>
                                    <div class="add-modal-offers-loading">
                                        <lightning-spinner size="x-small" alternative-text="Loading offers..." variant="brand"></lightning-spinner>
                                        <span class="slds-text-body_small slds-m-left_x-small">Loading offers…</span>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <lightning-combobox
                                        label="Offer (optional)"
                                        placeholder="Select an active offer…"
                                        value={offerId}
                                        options={offerOptions}
                                        onchange={handleOfferChange}
                                    ></lightning-combobox>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ── Section: Banner Placeholders ───────────────────────── -->
                <template lwc:if={isBannerChannel}>
                    <div class="add-modal-section-divider"></div>
                    <div class="add-modal-section-header">
                        <h3 class="add-modal-section-title">
                            Placeholders
                            <abbr class="slds-required" title="required">*</abbr>
                        </h3>
                        <template lwc:if={placeholderMissing}>
                            <span class="add-modal-subtype-required">Select at least one placeholder.</span>
                        </template>
                    </div>
                    <lightning-dual-listbox
                        label="Banner Placeholders"
                        variant="label-hidden"
                        source-label="Available"
                        selected-label="Selected"
                        options={placeholderOptions}
                        value={selectedPlaceholders}
                        size="6"
                        class="add-modal-dual-listbox"
                        onchange={handlePlaceholderChange}
                    ></lightning-dual-listbox>
                </template>

                <!-- ── Section: Per-channel subtype tiles ─────────────────── -->
                <template lwc:if={showMessageTypeSection}>
                    <div class="add-modal-section-divider"></div>
                    <div class="add-modal-section-header">
                        <h3 class="add-modal-section-title">
                            {subtypeLabel}
                            <abbr class="slds-required" title="required">*</abbr>
                        </h3>
                        <template lwc:if={subtypeValidationMsg}>
                            <span class="add-modal-subtype-required">{subtypeValidationMsg}</span>
                        </template>
                    </div>
                    <template lwc:if={showMissingTemplateTiles}>
                        <p class="slds-text-color_error slds-text-body_small slds-m-bottom_x-small">
                            No active validated template is available for this channel.
                        </p>
                    </template>
                    <template lwc:if={templatesLoading}>
                        <template lwc:if={usesTemplateTiles}>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">Loading templates…</p>
                        </template>
                    </template>
                    <div class="add-modal-tiles">
                        <template for:each={subtypeTiles} for:item="tile">
                            <div
                                key={tile.value}
                                class={tile.tileClass}
                                data-value={tile.value}
                                onclick={handleSelectSubtype}
                                role="button"
                                tabindex="0"
                            >
                                <div class="add-modal-tile__icon">
                                    <lightning-icon icon-name={tile.icon} size="medium"></lightning-icon>
                                </div>
                                <div class="add-modal-tile__body">
                                    <span class="add-modal-tile__label">{tile.label}</span>
                                    <template lwc:if={tile.description}>
                                        <span class="add-modal-tile__desc">{tile.description}</span>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

            </div>

            <!-- Footer -->
            <footer class="slds-modal__footer add-modal-footer">
                <lightning-button
                    label="Cancel"
                    onclick={handleCancel}
                    disabled={isSaving}
                ></lightning-button>
                <div class="add-modal-footer-actions">
                    <lightning-button
                        label="Save as Draft"
                        variant="neutral"
                        onclick={handleSaveDraft}
                        disabled={saveDisabled}
                    ></lightning-button>
                    <lightning-button
                        label="Create &amp; Edit"
                        variant="brand"
                        icon-name="utility:edit"
                        icon-position="right"
                        onclick={handleSaveAndEdit}
                        disabled={saveAndEditDisabled}
                    ></lightning-button>
                </div>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
