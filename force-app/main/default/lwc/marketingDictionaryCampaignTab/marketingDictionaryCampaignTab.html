<template>
    <div class="vtab-layout">

        <!-- Vertical nav sidebar -->
        <nav class="vtab-sidebar" role="tablist" aria-orientation="vertical">
            <button role="tab" class={vtabClass.campaignTypes} data-tab="campaignTypes" onclick={handleSubTabClick}
                aria-selected={vtabSelected.campaignTypes}>
                <lightning-icon icon-name="utility:campaign" size="x-small" class="vtab-icon" alternative-text=""></lightning-icon>
                Campaign Types
            </button>
            <button role="tab" class={vtabClass.scorings} data-tab="scorings" onclick={handleSubTabClick}
                aria-selected={vtabSelected.scorings}>
                <lightning-icon icon-name="utility:rating" size="x-small" class="vtab-icon" alternative-text=""></lightning-icon>
                Scoring Models
            </button>
            <button role="tab" class={vtabClass.tiers} data-tab="tiers" onclick={handleSubTabClick}
                aria-selected={vtabSelected.tiers}>
                <lightning-icon icon-name="utility:priority" size="x-small" class="vtab-icon" alternative-text=""></lightning-icon>
                Tiers
            </button>
            <button role="tab" class={vtabClass.topics} data-tab="topics" onclick={handleSubTabClick}
                aria-selected={vtabSelected.topics}>
                <lightning-icon icon-name="utility:topic" size="x-small" class="vtab-icon" alternative-text=""></lightning-icon>
                Topics
            </button>
            <button role="tab" class={vtabClass.activationPaths} data-tab="activationPaths" onclick={handleSubTabClick}
                aria-selected={vtabSelected.activationPaths}>
                <lightning-icon icon-name="utility:routing_offline" size="x-small" class="vtab-icon" alternative-text=""></lightning-icon>
                Activation Paths
            </button>
            <button role="tab" class={vtabClass.salesProcessTypes} data-tab="salesProcessTypes" onclick={handleSubTabClick}
                aria-selected={vtabSelected.salesProcessTypes}>
                <lightning-icon icon-name="utility:process" size="x-small" class="vtab-icon" alternative-text=""></lightning-icon>
                Sales Process Types
            </button>
        </nav>

        <!-- Content panel -->
        <div class="vtab-content" role="tabpanel">

        <!-- ══════════════════════════════════════════════════════════
             A. CAMPAIGN TYPES
        ══════════════════════════════════════════════════════════ -->
        <template lwc:if={isTab.campaignTypes}>
            <div class="slds-p-around_small">
                <div class="cd-toolbar slds-m-bottom_small">
                    <h2 class="slds-text-heading_small">
                        Campaign Types
                        <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{campaignTypeCount}</span>
                    </h2>
                    <lightning-button label="Add Campaign Type" icon-name="utility:add" variant="brand"
                        onclick={handleNewCampaignType}>
                    </lightning-button>
                </div>

                <template lwc:if={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                <template lwc:elseif={hasCampaignTypes}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped cd-ct-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th class="cd-col-ct-name"><span class="slds-truncate">Campaign Type</span></th>
                                <th class="cd-col-flag slds-text-align_center">Include in Emergency</th>
                                <th><span class="slds-truncate">Campaign Groups</span></th>
                                <th class="action-col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={campaignTypes} for:item="ct">
                                <tr key={ct.Id}>
                                    <td>
                                        <div class="slds-truncate slds-text-title_bold" title={ct.Name}>{ct.Name}</div>
                                    </td>
                                    <td class="slds-text-align_center cd-col-flag">
                                        <template lwc:if={ct.Include_In_Emergency__c}>
                                            <lightning-icon icon-name="utility:check" size="xx-small"
                                                alternative-text="Yes" class="cd-check-icon">
                                            </lightning-icon>
                                        </template>
                                    </td>
                                    <td class="cd-col-groups">
                                        <template lwc:if={ct.definesGroups}>
                                            <div class="cd-inline-groups">
                                                <template lwc:if={ct.hasGroups}>
                                                    <div class="cd-inline-groups__list">
                                                        <template for:each={ct.groups} for:item="g">
                                                            <span key={g.Id} class="slds-badge cd-group-badge">
                                                                {g.Name}
                                                                <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                                    size="xx-small" alternative-text="Edit" title="Edit group"
                                                                    data-id={g.Id} onclick={handleEditCampaignGroup}
                                                                    class="slds-m-left_xx-small cd-group-badge-action">
                                                                </lightning-button-icon>
                                                                <lightning-button-icon icon-name="utility:close" variant="bare"
                                                                    size="xx-small" alternative-text="Delete" title="Delete group"
                                                                    data-id={g.Id} data-name={g.Name} onclick={handleDeleteCampaignRecord}
                                                                    class="slds-m-left_xx-small cd-group-badge-action">
                                                                </lightning-button-icon>
                                                            </span>
                                                        </template>
                                                    </div>
                                                </template>
                                                <template lwc:else>
                                                    <span class="slds-text-body_small slds-text-color_weak">No groups yet</span>
                                                </template>
                                                <lightning-button label="Add Group" icon-name="utility:add" variant="neutral"
                                                    size="x-small" data-type-id={ct.Id} onclick={handleNewCampaignGroup}
                                                    class="cd-inline-groups__add">
                                                </lightning-button>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <span class="slds-text-body_small slds-text-color_weak cd-groups-disabled"
                                                title="Enable Define Campaign Groups on this type to add groups.">
                                                Not enabled
                                            </span>
                                        </template>
                                    </td>
                                    <td class="action-col">
                                        <lightning-button-icon icon-name="utility:edit" variant="border-filled"
                                            size="x-small" alternative-text="Edit" title="Edit"
                                            data-id={ct.Id} onclick={handleEditCampaignType}
                                            class="slds-m-right_xx-small">
                                        </lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                            size="x-small" alternative-text="Delete" title="Delete"
                                            data-id={ct.Id} data-name={ct.Name} onclick={handleDeleteCampaignType}>
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">No campaign types defined yet.</p>
                </template>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════
             B. Scorings
        ══════════════════════════════════════════════════════════ -->
        <template lwc:if={isTab.scorings}>
            <div class="slds-p-around_small">
                <!-- Model Groups -->
                <div class="cd-section-header slds-m-bottom_x-small">
                    <h3 class="slds-text-title_caps slds-text-color_weak">Model Groups</h3>
                    <lightning-button label="Add Model Group" icon-name="utility:add" variant="neutral"
                        onclick={handleNewModelGroup}>
                    </lightning-button>
                </div>
                <template lwc:if={hasScoringModelGroups}>
                    <div class="slds-m-bottom_medium cd-badge-row">
                        <template for:each={scoringModelGroups} for:item="grp">
                            <span key={grp.Id} class="slds-badge cd-group-badge slds-m-right_xx-small slds-m-bottom_xx-small">
                                {grp.Name}
                                <lightning-button-icon icon-name="utility:edit" variant="bare" size="x-small"
                                    alternative-text="Edit" title="Edit" class="slds-m-left_xx-small"
                                    data-id={grp.Id} onclick={handleEditModelGroup}>
                                </lightning-button-icon>
                                <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                    alternative-text="Delete" title="Delete"
                                    data-id={grp.Id} data-name={grp.Name} onclick={handleDeleteModelGroup}>
                                </lightning-button-icon>
                            </span>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">No model groups yet. Add a group before creating scoring models.</p>
                </template>

                <!-- Scoring Models list -->
                <div class="cd-toolbar slds-m-bottom_small">
                    <h2 class="slds-text-heading_small">
                        Campaign Scoring Models
                        <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{scoringsCount}</span>
                    </h2>
                    <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-center">
                        <template lwc:if={hasScoringSelection}>
                            <div class="slds-col slds-no-flex">
                                <span class="slds-text-body_small slds-m-right_x-small">
                                    {scoringSelectedCount} selected
                                </span>
                                <lightning-button label="Delete selected" icon-name="utility:delete"
                                    variant="destructive-text" onclick={handleBulkDeleteScorings}
                                    class="slds-m-right_xx-small">
                                </lightning-button>
                                <lightning-button label="Clear" variant="neutral"
                                    onclick={handleClearScoringSelection}>
                                </lightning-button>
                            </div>
                        </template>
                        <div class="slds-col slds-no-flex">
                            <lightning-input type="search" label="Filter" variant="label-hidden"
                                placeholder="Search models..." value={scoringSearch}
                                onchange={handleScoringSearch} class="cd-search-input">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <lightning-button label="Add Model Definition" icon-name="utility:add" variant="brand"
                                onclick={handleNewScoring}>
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <template lwc:if={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                <template lwc:elseif={hasScorings}>
                    <div class="scoring-table-wrap">
                    <table class="slds-table slds-table_bordered slds-table_fixed-layout scoring-models-table"
                        role="treegrid" aria-label="Campaign Scoring Models">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" class="scoring-col-check">
                                    <span class="slds-assistive-text">Select</span>
                                    <input type="checkbox"
                                        class="scoring-select-all-cb"
                                        title={scoringSelectAllTitle}
                                        checked={isAllVisibleScoringsSelected}
                                        onchange={handleScoringSelectAll} />
                                </th>
                                <template for:each={scoringSortHeaders} for:item="col">
                                    <th key={col.field} scope="col" class={col.thClass}
                                        aria-sort={col.ariaSort}
                                        data-field={col.field}
                                        onclick={handleScoringSort}>
                                        <div class="slds-truncate scoring-th-label" title={col.label}>
                                            <span>{col.label}</span>
                                            <template lwc:if={col.showSortIcon}>
                                                <lightning-icon icon-name={col.sortIcon} size="xx-small"
                                                    class="slds-m-left_xx-small scoring-sort-icon">
                                                </lightning-icon>
                                            </template>
                                        </div>
                                    </th>
                                </template>
                                <th scope="col" class="scoring-col-actions">
                                    <span class="slds-assistive-text">Actions</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={scoringTableRows} for:item="row">
                                <tr key={row.rowKey}
                                    class={row.rowClass}
                                    data-name={row.name}
                                    data-row-type={row.rowType}
                                    onclick={handleScoringRowClick}
                                    aria-expanded={row.ariaExpanded}
                                    role="row">
                                    <td class="scoring-col-check scoring-row-control" onclick={handleStopPropagation}>
                                        <template lwc:if={row.isMaster}>
                                            <input type="checkbox"
                                                class="scoring-master-cb scoring-row-cb"
                                                data-name={row.name}
                                                title={row.checkboxTitle}
                                                checked={row.isSelected}
                                                onchange={handleScoringMasterCheckbox}
                                                onclick={handleStopPropagation} />
                                        </template>
                                        <template lwc:else>
                                            <input type="checkbox"
                                                class="scoring-row-cb"
                                                data-id={row.Id}
                                                checked={row.isSelected}
                                                onchange={handleScoringChildCheckbox} />
                                        </template>
                                    </td>
                                    <td class="scoring-col-name">
                                        <template lwc:if={row.isMaster}>
                                            <div class="scoring-master-name">
                                                <lightning-icon icon-name={row.chevronIcon} size="xx-small"
                                                    class="scoring-expand-chevron slds-m-right_xx-small">
                                                </lightning-icon>
                                                <span class="slds-truncate slds-text-title_bold" title={row.name}>{row.name}</span>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="scoring-child-indent slds-text-color_weak" aria-hidden="true"></div>
                                        </template>
                                    </td>
                                    <td class="scoring-col-versions">
                                        <template lwc:if={row.isMaster}>
                                            <span class="slds-badge slds-badge_lightest slds-truncate" title={row.versionCountLabel}>{row.versionCountLabel}</span>
                                        </template>
                                        <template lwc:else>
                                            <span class="slds-truncate" title={row.Version__c}>v{row.Version__c}</span>
                                        </template>
                                    </td>
                                    <td class="scoring-col-modelid">
                                        <template lwc:if={row.isMaster}>
                                            <span class="slds-truncate">—</span>
                                        </template>
                                        <template lwc:else>
                                            <code class="slds-truncate scoring-model-id" title={row.Model_Id__c}>{row.Model_Id__c}</code>
                                        </template>
                                    </td>
                                    <td class="scoring-col-group">
                                        <span class="slds-badge cd-group-badge-sm slds-truncate" title={row.groupName}>{row.groupName}</span>
                                    </td>
                                    <td class="scoring-col-topic">
                                        <span class="slds-truncate" title={row.topicName}>{row.topicName}</span>
                                    </td>
                                    <td class="scoring-col-offering">
                                        <div class="slds-truncate" title={row.offeringLabel}>{row.offeringLabel}</div>
                                        <div class="slds-text-body_small slds-text-color_weak slds-truncate" title={row.offeringValuesShort}>{row.offeringValuesShort}</div>
                                    </td>
                                    <td class="scoring-col-expires">
                                        <template lwc:if={row.isMaster}>
                                            <span class="slds-truncate">—</span>
                                        </template>
                                        <template lwc:else>
                                            <span class="slds-truncate" title={row.expirationDisplay}>{row.expirationDisplay}</span>
                                        </template>
                                    </td>
                                    <td class="scoring-col-status">
                                        <span class={row.statusBadgeClass} title={row.statusLabel}>{row.statusLabel}</span>
                                    </td>
                                    <td class="scoring-col-actions scoring-row-control" onclick={handleStopPropagation}>
                                        <div class="scoring-actions">
                                            <template lwc:if={row.isMaster}>
                                                <lightning-button-icon icon-name="utility:new" variant="border-filled"
                                                    size="x-small" alternative-text="New Version" title="New Version"
                                                    data-id={row.latestId} onclick={handleNewScoringVersion}>
                                                </lightning-button-icon>
                                            </template>
                                            <template lwc:else>
                                                <lightning-button-icon icon-name="utility:new" variant="border-filled"
                                                    size="x-small" alternative-text="New Version" title="New Version"
                                                    data-id={row.Id} onclick={handleNewScoringVersion}>
                                                </lightning-button-icon>
                                                <lightning-button-icon icon-name="utility:edit" variant="border-filled"
                                                    size="x-small" alternative-text="Edit" title="Edit"
                                                    data-id={row.Id} onclick={handleEditScoring}>
                                                </lightning-button-icon>
                                                <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                                    size="x-small" alternative-text="Delete" title="Delete"
                                                    data-id={row.Id} data-name={row.Model_Id__c} onclick={handleDeleteCampaignRecord}>
                                                </lightning-button-icon>
                                            </template>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{scoringCountLabel}</p>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">No scoring models defined yet.</p>
                </template>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════
             C. TIERS
        ══════════════════════════════════════════════════════════ -->
        <template lwc:if={isTab.tiers}>
            <div class="slds-p-around_small">
                <div class="cd-toolbar slds-m-bottom_small">
                    <h2 class="slds-text-heading_small">
                        Campaign Tiers
                        <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{tierCount}</span>
                    </h2>
                    <lightning-button label="Add Tier" icon-name="utility:add" variant="brand"
                        onclick={handleNewTier}>
                    </lightning-button>
                </div>

                <template lwc:if={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                <template lwc:elseif={hasTiers}>
                    <div class="tier-grid">
                        <template for:each={tiers} for:item="tier">
                            <div key={tier.Id} class="tier-card">
                                <div class="tier-card__header">
                                    <div class="tier-card__number">Tier {tier.Tier_Number__c}</div>
                                    <div class="tier-card__actions">
                                        <lightning-button-icon icon-name="utility:edit" variant="bare"
                                            size="x-small" alternative-text="Edit" title="Edit"
                                            data-id={tier.Id} onclick={handleEditTier}>
                                        </lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:delete" variant="bare"
                                            size="x-small" alternative-text="Delete" title="Delete"
                                            data-id={tier.Id} data-num={tier.Tier_Number__c} onclick={handleDeleteTier}
                                            class="slds-m-left_xx-small">
                                        </lightning-button-icon>
                                    </div>
                                </div>
                                <template lwc:if={tier.Description__c}>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small tier-card__desc">{tier.Description__c}</p>
                                </template>
                                <template lwc:if={tier.hasTypes}>
                                    <div class="tier-type-chips slds-m-top_xx-small">
                                        <template for:each={tier.typeChips} for:item="tc">
                                            <span key={tc} class="slds-badge slds-badge_lightest tier-type-chip">{tc}</span>
                                        </template>
                                    </div>
                                </template>
                                <div class="tier-attrs slds-m-top_x-small">
                                    <template for:each={tier.attrRows} for:item="attr">
                                        <div key={attr.label} class="tier-attr-row">
                                            <span class="tier-attr-label">{attr.label}</span>
                                            <span class={attr.badgeClass}>{attr.value}</span>
                                        </div>
                                    </template>
                                </div>
                                <template lwc:if={tier.hasExclusions}>
                                    <div class="tier-exclusions slds-m-top_x-small">
                                        <p class="slds-text-body_small slds-text-title_caps slds-text-color_weak">Exclusions</p>
                                        <div class="tier-excl-chips slds-m-top_xx-small">
                                            <template for:each={tier.exclusionChips} for:item="chip">
                                                <span key={chip} class="slds-badge tier-excl-chip">{chip}</span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">No tiers defined yet.</p>
                </template>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════
             D. TOPICS
        ══════════════════════════════════════════════════════════ -->
        <template lwc:if={isTab.topics}>
            <div class="slds-p-around_small">
                <!-- Topic Groups sub-section -->
                <div class="cd-section-header slds-m-bottom_x-small">
                    <h3 class="slds-text-title_caps slds-text-color_weak">Topic Groups</h3>
                    <lightning-button label="Add Topic Group" icon-name="utility:add" variant="neutral" size="small"
                        onclick={handleNewTopicGroup}>
                    </lightning-button>
                </div>
                <template lwc:if={hasTopicGroups}>
                    <div class="slds-grid slds-wrap slds-gutters_xx-small slds-m-bottom_medium">
                        <template for:each={topicGroups} for:item="tg">
                            <div key={tg.Id} class="slds-col slds-no-flex slds-m-bottom_xx-small">
                                <span class="slds-badge cd-group-badge">
                                    {tg.Name}
                                    <lightning-button-icon icon-name="utility:edit" variant="bare"
                                        size="xx-small" alternative-text="Edit" title="Edit group"
                                        data-id={tg.Id} onclick={handleEditTopicGroup}
                                        class="slds-m-left_xx-small cd-group-badge-action">
                                    </lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:close" variant="bare"
                                        size="xx-small" alternative-text="Delete" title="Delete group"
                                        data-id={tg.Id} data-name={tg.Name} onclick={handleDeleteTopicGroup}
                                        class="slds-m-left_xx-small cd-group-badge-action">
                                    </lightning-button-icon>
                                </span>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">No topic groups yet.</p>
                </template>

                <!-- Topics list -->
                <div class="cd-section-header slds-m-bottom_x-small">
                    <h3 class="slds-text-title_caps slds-text-color_weak">
                        Topics
                        <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{topicCount}</span>
                    </h3>
                    <div class="slds-grid slds-gutters_x-small">
                        <div class="slds-col slds-no-flex">
                            <lightning-input type="search" label="Filter" variant="label-hidden"
                                placeholder="Search topics..." value={topicSearch}
                                onchange={handleTopicSearch} class="cd-search-input">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <lightning-button label="Add Topic" icon-name="utility:add" variant="brand"
                                onclick={handleNewTopic}>
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <template lwc:if={hasTopics}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th style="width:28%"><span class="slds-truncate">Topic Name</span></th>
                                <th style="width:18%"><span class="slds-truncate">Group</span></th>
                                <th><span class="slds-truncate">Description</span></th>
                                <th class="action-col"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredTopics} for:item="tp">
                                <tr key={tp.Id}>
                                    <td class="slds-truncate">{tp.Name}</td>
                                    <td>
                                        <template lwc:if={tp.Topic_Group_Dict__r.Name}>
                                            <span class="slds-badge cd-group-badge-sm">{tp.Topic_Group_Dict__r.Name}</span>
                                        </template>
                                    </td>
                                    <td class="cd-col-desc slds-truncate">{tp.Topic_Description__c}</td>
                                    <td class="action-col">
                                        <lightning-button-icon icon-name="utility:edit" variant="border-filled"
                                            size="x-small" alternative-text="Edit" title="Edit"
                                            data-id={tp.Id} onclick={handleEditTopic}
                                            class="slds-m-right_xx-small">
                                        </lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                            size="x-small" alternative-text="Delete" title="Delete"
                                            data-id={tp.Id} data-name={tp.Name} onclick={handleDeleteCampaignRecord}>
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{topicCountLabel}</p>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">No topics defined yet.</p>
                </template>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════
             E. ACTIVATION PATHS
        ══════════════════════════════════════════════════════════ -->
        <template lwc:if={isTab.activationPaths}>
            <div class="slds-p-around_small">
                <div class="cd-toolbar slds-m-bottom_small">
                    <div>
                        <h2 class="slds-text-heading_small">Activation Paths</h2>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Active paths share 100% of baseline distribution.
                            Sum of active path percentages: <strong>{activePathsSum}%</strong>
                            <template lwc:if={pathSumWarning}>
                                <lightning-icon icon-name="utility:warning" size="xx-small"
                                    variant="warning" class="slds-m-left_xx-small" alternative-text="Warning">
                                </lightning-icon>
                                <span class="cd-warn-text"> exceeds 100%</span>
                            </template>
                        </p>
                    </div>
                    <div class="slds-grid slds-gutters_x-small">
                        <div class="slds-col slds-no-flex">
                            <lightning-button label="Allocate Equally" icon-name="utility:share" variant="neutral"
                                onclick={handleAllocateEqually} disabled={noActivePaths}>
                            </lightning-button>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <lightning-button label="Add Path" icon-name="utility:add" variant="brand"
                                onclick={handleNewPath}>
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <template lwc:if={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                <template lwc:elseif={hasPaths}>
                    <div class="path-list">
                        <template for:each={paths} for:item="path">
                            <div key={path.Id} class={path.cardClass}>
                                <div class="path-card__left">
                                    <span class={path.statusBadgeClass}>{path.statusLabel}</span>
                                    <span class="slds-text-body_regular slds-m-left_x-small">{path.Name}</span>
                                </div>
                                <div class="path-card__center">
                                    <template lwc:if={path.Is_Active__c}>
                                        <lightning-input type="number" label="Distribution %" variant="label-hidden"
                                            min="0" max="100" step="0.01"
                                            value={path.Distribution_Percent__c}
                                            data-id={path.Id}
                                            onchange={handlePathPercentChange}
                                            class="path-pct-input">
                                        </lightning-input>
                                        <span class="slds-m-left_xx-small slds-text-body_small">%</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="slds-text-body_small slds-text-color_weak">—</span>
                                    </template>
                                </div>
                                <div class="path-card__right">
                                    <lightning-input type="toggle" label={path.toggleLabel}
                                        checked={path.Is_Active__c}
                                        data-id={path.Id} onchange={handlePathToggle}
                                        message-toggle-active="Active" message-toggle-inactive="Inactive"
                                        class="path-toggle">
                                    </lightning-input>
                                    <lightning-button-icon icon-name="utility:edit" variant="border-filled"
                                        size="x-small" alternative-text="Edit" title="Edit"
                                        data-id={path.Id} onclick={handleEditPath}
                                        class="slds-m-left_x-small">
                                    </lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                        size="x-small" alternative-text="Delete" title="Delete"
                                        data-id={path.Id} data-name={path.Name} onclick={handleDeleteCampaignRecord}
                                        class="slds-m-left_xx-small">
                                    </lightning-button-icon>
                                </div>
                            </div>
                        </template>
                    </div>
                    <lightning-button label="Save Distribution" variant="brand" icon-name="utility:save"
                        onclick={handleSaveDistribution} disabled={isSaving}
                        class="slds-m-top_small">
                    </lightning-button>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">No activation paths defined yet.</p>
                </template>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════
             F. SALES PROCESS TYPES
        ══════════════════════════════════════════════════════════ -->
        <template lwc:if={isTab.salesProcessTypes}>
            <div class="slds-p-around_small">
                <div class="cd-toolbar slds-m-bottom_small">
                    <h2 class="slds-text-heading_small">
                        Sales Process Types
                        <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{salesProcessTypeCount}</span>
                    </h2>
                    <lightning-button label="Add Sales Process Type" icon-name="utility:add" variant="brand"
                        onclick={handleNewSalesProcessType}>
                    </lightning-button>
                </div>

                <template lwc:if={hasSalesProcessTypes}>
                    <ul class="slds-has-dividers_top-space">
                        <template for:each={salesProcessTypes} for:item="sp">
                            <li key={sp.Id} class="slds-item slds-grid slds-grid_vertical-align-center slds-p-vertical_xx-small">
                                <div class="slds-col">
                                    <span class="slds-text-body_regular">{sp.Name}</span>
                                    <template lwc:if={sp.Topic_Description__c}>
                                        <p class="slds-text-body_small slds-text-color_weak">{sp.Topic_Description__c}</p>
                                    </template>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <lightning-button-icon icon-name="utility:edit" variant="border-filled"
                                        size="x-small" alternative-text="Edit" title="Edit"
                                        data-id={sp.Id} onclick={handleEditSalesProcessType}
                                        class="slds-m-right_xx-small">
                                    </lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                        size="x-small" alternative-text="Delete" title="Delete"
                                        data-id={sp.Id} data-name={sp.Name} onclick={handleDeleteCampaignRecord}>
                                    </lightning-button-icon>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_small slds-text-color_weak">No sales process types defined yet.</p>
                </template>
            </div>
        </template>

        </div><!-- /vtab-content -->
    </div><!-- /vtab-layout -->

    <!-- ══════════════════════════════════════════════════════════
         CAMPAIGN TYPE MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isCampaignTypeModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="ct-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="ct-modal-title" class="slds-modal__title">{campaignTypeModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeCampaignTypeModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Campaign Type Name" required value={editCampaignType.Name}
                        data-field="Name" onchange={handleCampaignTypeFieldChange}>
                    </lightning-input>
                    <lightning-input type="checkbox" label="Include in Emergency"
                        checked={editCampaignType.Include_In_Emergency__c}
                        data-field="Include_In_Emergency__c" onchange={handleCampaignTypeCheckboxChange}
                        class="slds-m-top_small">
                    </lightning-input>
                    <lightning-input type="checkbox" label="Define Campaign Groups"
                        field-level-help="When on, group names are managed in this type’s table row and campaigns of this type must pick one."
                        checked={editCampaignType.Define_Campaign_Groups__c}
                        data-field="Define_Campaign_Groups__c" onchange={handleCampaignTypeCheckboxChange}
                        class="slds-m-top_small">
                    </lightning-input>
                    <lightning-input label="Campaign Type Icon" placeholder="eg. utility:send" value={editCampaignType.Icon}
                        data-field="Icon" onchange={handleCampaignTypeFieldChange}>
                    </lightning-input>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeCampaignTypeModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveCampaignType} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         CAMPAIGN GROUP MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isCampaignGroupModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="cg-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="cg-modal-title" class="slds-modal__title">{campaignGroupModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeCampaignGroupModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={isCampaignGroupTypeLocked}>
                        <div class="slds-form-element slds-m-bottom_small">
                            <label class="slds-form-element__label">Campaign Type</label>
                            <div class="slds-form-element__control">
                                <span class="slds-text-body_regular">{campaignGroupParentName}</span>
                            </div>
                        </div>
                    </template>
                    <template lwc:else>
                        <lightning-combobox label="Campaign Type" required value={editCampaignGroup.Campaign_Type_Dict__c}
                            options={campaignTypeOptions} placeholder="Select campaign type..."
                            data-field="Campaign_Type_Dict__c" onchange={handleCampaignGroupFieldChange}
                            class="slds-m-bottom_small">
                        </lightning-combobox>
                    </template>
                    <lightning-input label="Group Name" required value={editCampaignGroup.Name}
                        data-field="Name" onchange={handleCampaignGroupFieldChange}>
                    </lightning-input>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeCampaignGroupModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveCampaignGroup} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         SCORING MODEL GROUP MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isModelGroupModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="smg-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="smg-modal-title" class="slds-modal__title">{modelGroupModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeModelGroupModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Group Name" required value={editModelGroup.Name}
                        data-field="Name" onchange={handleModelGroupFieldChange}>
                    </lightning-input>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModelGroupModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveModelGroup} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         SCORING MODAL
    ══════════════════════════════════════════════════════════ -->

    <template lwc:if={isScoringModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="sc-modal-title"
            class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container scoring-modal-container">
                <div class="slds-modal__header">
                    <h2 id="sc-modal-title" class="slds-modal__title">{scoringModelModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeScoringModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">

                    <div class="scoring-status-bar slds-m-bottom_medium">
                        <div class="scoring-status-bar__left">
                            <span class="slds-text-title_caps slds-text-color_weak">Status</span>
                            <span class={scoringStatusBadgeClass}>{scoringStatusLabel}</span>
                            <template lwc:if={scoringActivationHint}>
                                <span class="slds-text-body_small slds-text-color_weak scoring-status-hint">{scoringActivationHint}</span>
                            </template>
                        </div>
                        <div class="scoring-status-bar__right">
                            <lightning-input type="toggle"
                                label="Active"
                                checked={editScoring.Is_Active__c}
                                message-toggle-active="Active"
                                message-toggle-inactive="Inactive"
                                onchange={handleScoringActiveToggle}>
                            </lightning-input>
                        </div>
                    </div>

                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input type="text" label="Model Name" required
                                value={editScoring.Name}
                                disabled={isScoringNameReadOnly}
                                data-field="Name" onchange={handleScoringFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input type="number" label="Model Version" required
                                value={editScoring.Version__c}
                                disabled
                                field-level-help="Auto-set to 1 for a new model; incremented for each new version.">
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-input type="text" label="Model ID" required
                                value={computedModelIdPreview}
                                disabled
                                field-level-help="Autopopulated as ModelName_Version.">
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                            <lightning-combobox label="Model Group"
                                value={editScoring.Scoring_Model_Group_Dict__c}
                                options={scoringModelGroupOptions}
                                placeholder="Select model group..."
                                data-field="Scoring_Model_Group_Dict__c"
                                onchange={handleScoringFieldChange}
                                field-level-help="Required to activate the model.">
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                            <lightning-combobox label="Topic"
                                value={editScoring.Assigned_Topic_Dict__c}
                                options={topicOptions}
                                placeholder="Select topic..."
                                data-field="Assigned_Topic_Dict__c"
                                onchange={handleScoringFieldChange}
                                field-level-help="Required to activate the model.">
                            </lightning-combobox>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                            <lightning-combobox label="Scoring Model Source System"
                                value={editScoring.Scoring_Model_Source_System__c}
                                options={scoringSourceSystemOptions}
                                placeholder="Select source system..."
                                data-field="Scoring_Model_Source_System__c"
                                onchange={handleScoringFieldChange}
                                field-level-help="Required to activate. Where this scoring model is executed (GCP or Salesforce Einstein).">
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                            <template lwc:if={hasData360DmoCatalogue}>
                                <lightning-combobox label="Data360 DMO"
                                    value={editScoring.Data360_DMO__c}
                                    options={data360DmoOptions}
                                    placeholder="Select Data360 DMO..."
                                    data-field="Data360_DMO__c"
                                    onchange={handleScoringFieldChange}
                                    field-level-help="Required to activate. Data Model Object in Data360 used with this scoring model.">
                                </lightning-combobox>
                            </template>
                            <template lwc:else>
                                <lightning-input type="text" label="Data360 DMO"
                                    value={editScoring.Data360_DMO__c}
                                    placeholder="Enter DMO API name (e.g. ssot__Individual__dlm)"
                                    data-field="Data360_DMO__c"
                                    onchange={handleScoringFieldChange}
                                    field-level-help="Required to activate. Catalogue unavailable — enter the DMO API name manually."
                                    max-length="255">
                                </lightning-input>
                            </template>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                            <lightning-textarea label="Model Description"
                                value={editScoring.Topic_Description__c}
                                data-field="Topic_Description__c"
                                onchange={handleScoringFieldChange}
                                max-length="500" rows="2">
                            </lightning-textarea>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                            <lightning-input type="date" label="Model Expiration Date"
                                value={editScoring.Model_Expiration_Date__c}
                                data-field="Model_Expiration_Date__c"
                                onchange={handleScoringFieldChange}>
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Offering Type (Campaign Wizard parity: filters, badges, Select All) -->
                    <div class="scoring-section slds-m-top_medium">
                        <fieldset class="slds-form-element" role="radiogroup">
                            <legend class="slds-form-element__legend slds-form-element__label">
                                Offering Type
                                <abbr class="slds-required" title="required">*</abbr>
                            </legend>
                            <div class="slds-form-element__control">
                                <div class="slds-radio_button-group">
                                    <template for:each={offeringTypeOptions} for:item="offering">
                                        <span key={offering.value} class="slds-button slds-radio_button">
                                            <input type="radio"
                                                   name="scoring-offering-type"
                                                   id={offering.uniqueId}
                                                   value={offering.value}
                                                   checked={offering.isChecked}
                                                   onchange={handleScoringOfferingTypeChange} />
                                            <label class="slds-radio_button__label" for={offering.uniqueId}>
                                                <span class="slds-radio_faux">{offering.label}</span>
                                            </label>
                                        </span>
                                    </template>
                                </div>
                            </div>
                        </fieldset>

                        <template lwc:if={isScoringOfferingProductFamily}>
                            <div class="slds-m-top_medium">
                                <label class="slds-form-element__label">Select Target Product Families <abbr class="slds-required" title="required">*</abbr></label>
                                <div class="slds-box slds-theme_default slds-m-top_xx-small scoring-offering-box">
                                    <div class="pf-filter-bar slds-p-bottom_small">
                                        <div class="slds-grid slds-wrap slds-grid_vertical-align-end slds-gutters_x-small">
                                            <div class="slds-col slds-size_1-of-2">
                                                <label class="pf-filter-label">Customer Type</label>
                                                <div class="pf-filter-pills">
                                                    <template for:each={customerTypeFilterOptions} for:item="ctf">
                                                        <span key={ctf.value} class={ctf.className} data-value={ctf.value}
                                                              onclick={handleCustomerTypeFilter}>{ctf.label}</span>
                                                    </template>
                                                </div>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2">
                                                <label class="pf-filter-label">Record Type</label>
                                                <div class="pf-filter-pills">
                                                    <template for:each={recordTypeFilterBadgeOptions} for:item="rtf">
                                                        <span key={rtf.value} class={rtf.className} data-value={rtf.value}
                                                              onclick={handleRecordTypeFilterBadge}>{rtf.label}</span>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="slds-p-vertical_small select-all-row-divider">
                                        <lightning-input type="checkbox" label="Select All"
                                            checked={selectAllProductFamilies}
                                            onchange={handleSelectAllProductFamilies}
                                            class="custom-master-checkbox">
                                        </lightning-input>
                                    </div>

                                    <template for:each={filteredGroupedProductFamilyOptions} for:item="group">
                                        <div key={group.recordType} class="slds-m-top_medium">
                                            <span class="pf-group-header">{group.recordType}</span>
                                            <div class="slds-grid pf-group-body slds-wrap slds-m-top_x-small">
                                                <template for:each={group.items} for:item="pf">
                                                    <div key={pf.value} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_x-small">
                                                        <div class="slds-form-element">
                                                            <div class="slds-form-element__control">
                                                                <div class="slds-checkbox">
                                                                    <input type="checkbox" id={pf.inputId}
                                                                           checked={pf.checked}
                                                                           data-value={pf.value}
                                                                           onchange={handleScoringProductFamilyToggle}
                                                                           class="scoring-native-checkbox" />
                                                                    <label class="slds-checkbox__label" for={pf.inputId}>
                                                                        <span class="slds-checkbox_faux"></span>
                                                                        <span class="slds-form-element__label pf-checkbox-label-wrapper">
                                                                            <span class="pf-label-text">{pf.label}</span>
                                                                            <span class="pf-badge-group">
                                                                                <template for:each={pf.fons} for:item="fon">
                                                                                    <span key={fon} class="slds-badge pf-fon-badge">{fon}</span>
                                                                                </template>
                                                                                <template for:each={pf.customerTypes} for:item="ct">
                                                                                    <span key={ct} class="slds-badge pf-customer-type-badge">{ct}</span>
                                                                                </template>
                                                                            </span>
                                                                        </span>
                                                                    </label>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isScoringOfferingFamilyOfNeeds}>
                            <div class="slds-m-top_medium">
                                <label class="slds-form-element__label">Select Target Family of Needs <abbr class="slds-required" title="required">*</abbr></label>
                                <div class="slds-box slds-theme_default slds-m-top_xx-small scoring-offering-box">
                                    <template lwc:if={fonCustomerTypeFilterOptions.length}>
                                        <div class="pf-filter-bar slds-p-bottom_small">
                                            <label class="pf-filter-label">Customer Type</label>
                                            <div class="pf-filter-pills">
                                                <template for:each={fonCustomerTypeFilterOptions} for:item="ctf">
                                                    <span key={ctf.value} class={ctf.className} data-value={ctf.value}
                                                          onclick={handleFonCustomerTypeFilter}>{ctf.label}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <div class="slds-p-vertical_small select-all-row-divider">
                                        <lightning-input type="checkbox" label="Select All"
                                            checked={selectAllFamilyOfNeeds}
                                            onchange={handleSelectAllFamilyOfNeeds}
                                            class="custom-master-checkbox">
                                        </lightning-input>
                                    </div>

                                    <div class="slds-grid slds-wrap slds-m-top_small">
                                        <template for:each={filteredFamilyOfNeedsOptions} for:item="fon">
                                            <div key={fon.value} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_x-small">
                                                <div class="slds-form-element">
                                                    <div class="slds-form-element__control">
                                                        <div class="slds-checkbox">
                                                            <input type="checkbox" id={fon.inputId}
                                                                   checked={fon.checked}
                                                                   data-value={fon.value}
                                                                   onchange={handleScoringFonToggle}
                                                                   class="scoring-native-checkbox" />
                                                            <label class="slds-checkbox__label" for={fon.inputId}>
                                                                <span class="slds-checkbox_faux"></span>
                                                                <span class="slds-form-element__label pf-checkbox-label-wrapper">
                                                                    <span class="pf-label-text">{fon.label}</span>
                                                                    <span class="pf-badge-group">
                                                                        <template for:each={fon.customerTypes} for:item="ct">
                                                                            <span key={ct} class="slds-badge pf-customer-type-badge">{ct}</span>
                                                                        </template>
                                                                    </span>
                                                                </span>
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <template lwc:if={showScoringAuditFields}>
                        <div class="scoring-system-info slds-m-top_medium">
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label">
                                    <span class="slds-truncate" title="Created By">Created By</span>
                                </dt>
                                <dd class="slds-dl_horizontal__detail slds-tile__detail slds-text-body_small">
                                    {scoringCreatedByLine}
                                </dd>
                                <dt class="slds-dl_horizontal__label">
                                    <span class="slds-truncate" title="Last Modified By">Last Modified By</span>
                                </dt>
                                <dd class="slds-dl_horizontal__detail slds-tile__detail slds-text-body_small">
                                    {scoringLastModifiedByLine}
                                </dd>
                            </dl>
                        </div>
                    </template>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeScoringModal}></lightning-button>
                    <lightning-button label={scoringSaveButtonLabel} variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveScoring} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


    <!-- ══════════════════════════════════════════════════════════
         TIER MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isTierModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="tier-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container tier-modal-container">
                <div class="slds-modal__header">
                    <h2 id="tier-modal-title" class="slds-modal__title">{tierModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeTierModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">

                    <!-- Row 1: Tier number + description -->
                    <div class="slds-grid slds-gutters_small">
                        <div class="slds-col slds-size_2-of-12">
                            <lightning-input type="number" label="Tier #" required min="1" step="1"
                                value={editTier.Tier_Number__c}
                                data-field="Tier_Number__c" onchange={handleTierFieldChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_10-of-12">
                            <lightning-textarea label="Description" value={editTier.Description__c}
                                data-field="Description__c" onchange={handleTierFieldChange}
                                max-length="500" rows="2">
                            </lightning-textarea>
                        </div>
                    </div>

                    <!-- Campaign Types row -->
                    <template lwc:if={hasCampaignTypes}>
                        <div class="slds-m-top_small tier-section">
                            <p class="tier-section-label">Supported Campaign Types</p>
                            <div class="slds-grid slds-wrap slds-gutters_xx-small">
                                <template for:each={campaignTypeCheckboxes} for:item="ctc">
                                    <div key={ctc.name} class="slds-col slds-no-flex">
                                        <lightning-input type="checkbox" label={ctc.name}
                                            checked={ctc.checked}
                                            data-name={ctc.name}
                                            onchange={handleTierCampaignTypeToggle}>
                                        </lightning-input>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Two-column: Attributes (left) | Exclusions (right) -->
                    <div class="slds-grid slds-gutters_medium slds-m-top_small">

                        <!-- Left: Behavioral Attributes -->
                        <div class="slds-col">
                            <p class="tier-section-label slds-m-bottom_x-small">Behavioral Attributes</p>
                            <div class="tier-modal-attrs">
                                <template for:each={tierAttrFields} for:item="af">
                                    <div key={af.field} class="tier-modal-attr-row">
                                        <span class="tier-modal-attr-label">{af.label}</span>
                                        <lightning-combobox label="" variant="label-hidden"
                                            value={af.value}
                                            options={af.options}
                                            data-field={af.field}
                                            onchange={handleTierAttrChange}
                                            class="tier-attr-combo">
                                        </lightning-combobox>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Right: Exclusions -->
                        <div class="slds-col">
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <p class="tier-section-label slds-col">Allowed Exclusions</p>
                                <div class="slds-col slds-no-flex">
                                    <lightning-input type="checkbox" label="Select All"
                                        checked={allExclusionsSelected}
                                        indeterminate={someExclusionsSelected}
                                        onchange={handleSelectAllExclusions}
                                        class="tier-select-all">
                                    </lightning-input>
                                </div>
                            </div>
                            <div class="tier-excl-list">
                                <template for:each={tierExclusionFields} for:item="ef">
                                    <div key={ef.field} class="tier-excl-item">
                                        <lightning-input type="checkbox" label={ef.label}
