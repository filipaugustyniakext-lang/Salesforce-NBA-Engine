                                            checked={ef.checked}
                                            data-field={ef.field}
                                            onchange={handleTierExclusionChange}>
                                        </lightning-input>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeTierModal}></lightning-button>
                    <lightning-button label="Save Tier" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveTier} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         TOPIC GROUP MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isTopicGroupModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="tg-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="tg-modal-title" class="slds-modal__title">{topicGroupModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeTopicGroupModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Group Name" required value={editTopicGroup.Name}
                        data-field="Name" onchange={handleTopicGroupFieldChange}>
                    </lightning-input>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeTopicGroupModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveTopicGroup} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         TOPIC MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isTopicModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="tp-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="tp-modal-title" class="slds-modal__title">{topicModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeTopicModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Topic Name" required value={editTopic.Name}
                        data-field="Name" onchange={handleTopicFieldChange}>
                    </lightning-input>
                    <lightning-combobox label="Topic Group" value={editTopic.Topic_Group_Dict__c}
                        options={topicGroupOptions} placeholder="Select group..."
                        data-field="Topic_Group_Dict__c" onchange={handleTopicFieldChange}
                        class="slds-m-top_small">
                    </lightning-combobox>
                    <lightning-textarea label="Description (optional)" value={editTopic.Topic_Description__c}
                        data-field="Topic_Description__c" onchange={handleTopicFieldChange}
                        class="slds-m-top_small" max-length="1000">
                    </lightning-textarea>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeTopicModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveTopic} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         ACTIVATION PATH MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isPathModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="path-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="path-modal-title" class="slds-modal__title">{pathModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closePathModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Path Name" required value={editPath.Name}
                        data-field="Name" onchange={handlePathFieldChange}>
                    </lightning-input>
                    <lightning-input type="checkbox" label="Active" checked={editPath.Is_Active__c}
                        data-field="Is_Active__c" onchange={handlePathCheckboxChange}
                        class="slds-m-top_small">
                    </lightning-input>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closePathModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSavePath} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         SALES PROCESS TYPE MODAL
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isSalesProcessTypeModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="sp-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="sp-modal-title" class="slds-modal__title">{salesProcessTypeModalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeSalesProcessTypeModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Sales Process Type Name" required value={editSalesProcessType.Name}
                        data-field="Name" onchange={handleSalesProcessTypeFieldChange}>
                    </lightning-input>
                    <lightning-textarea label="Description (optional)" value={editSalesProcessType.Topic_Description__c}
                        data-field="Topic_Description__c" onchange={handleSalesProcessTypeFieldChange}
                        class="slds-m-top_small">
                    </lightning-textarea>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeSalesProcessTypeModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSaveSalesProcessType} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ══════════════════════════════════════════════════════════
         DELETE CONFIRMATION
    ══════════════════════════════════════════════════════════ -->
    <template lwc:if={isDeleteModalOpen}>
        <section role="alertdialog" tabindex="-1" aria-modal="true" aria-labelledby="cd-del-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header slds-theme_warning slds-theme_alert-texture">
                    <h2 id="cd-del-title" class="slds-modal__title">Confirm Delete</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Delete <strong>{deleteTargetName}</strong>? This cannot be undone.</p>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeDeleteModal}></lightning-button>
                    <lightning-button label="Delete" variant="destructive" class="slds-m-left_x-small"
                        onclick={handleConfirmDelete}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
