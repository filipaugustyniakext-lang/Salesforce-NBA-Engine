<template>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large custom-modal-frame" onclick={handleBackdropClick}>
        <div class="slds-modal__container custom-modal-container md-app-root" onclick={handleContainerClick}>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading campaign..." size="medium" variant="brand"></lightning-spinner>
            </template>

            <header class="custom-modal-header">
                <div class="wizard-header-title-row">
                    <template lwc:if={isEditMode}>
                        <span class="slds-badge slds-badge_inverse wizard-edit-mode-badge">Edit Mode</span>
                    </template>
                    <h2 class="slds-text-heading_medium wizard-header-title">{modalTitle}</h2>
                </div>
                <!-- https://developer.salesforce.com/docs/platform/lightning-component-reference/guide/lightning-progress-step.html -->
                <lightning-progress-indicator
                    type="path"
                    class="wizard-progress-indicator"
                    current-step={wizardCurrentStepValue}
                    aria-label="Campaign wizard progress">
                    <template for:each={wizardSteps} for:item="step">
                        <lightning-progress-step
                            key={step.value}
                            label={step.label}
                            value={step.progressValue}
                            onstepfocus={handleWizardStepFocus}
                            onstepblur={handleWizardStepBlur}>
                        </lightning-progress-step>
                    </template>
                </lightning-progress-indicator>
            </header>

            <div class="custom-modal-body">

                <!-- STANDARD ACTIVATION CAMPAIGN WORKSPACE (MULTI-STEP) -->
                    <div class="properties-vertical-stack animate-fade-in">

                        <!-- STEP 1: three-tile grid (Basic | Priority / Exclusions) -->
                        <template lwc:if={isStep1}>
                            <div class="slds-grid slds-gutters slds-wrap wizard-step1-grid slds-m-bottom_large">

                                <!-- Tile 1: Basic Properties -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="slds-box wizard-section-box wizard-step1-tile">
                                    <span class="module-header-title">Basic Properties</span>

                                    <!-- Activation Type + Emergency Toggle Row -->
                                    <div class="slds-grid slds-grid_vertical-align-end slds-gutters slds-m-top_medium">
                                        <div class="slds-col">
                                            <label class="slds-form-element__label custom-label-style">
                                                Activation Type
                                                <abbr class="slds-required" title="required">*</abbr>
                                            </label>
                                            <template lwc:if={hasActivationTypeOptions}>
                                                <div class="slds-button-group activation-type-group slds-m-top_xx-small" role="group" aria-label="Activation Type">
                                                    <template for:each={activationOptions} for:item="option">
                                                        <button key={option.value}
                                                                class={option.btnClass}
                                                                data-value={option.value}
                                                                onclick={handleSelectActivation}
                                                                title={option.label}
                                                                type="button">
                                                            <lightning-icon icon-name={option.icon} size="small" class={option.iconClass}></lightning-icon>
                                                            <span class="activation-btn-label">{option.label}</span>
                                                        </button>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                    No active campaign types in Marketing Dictionary. Add types under Campaigns → Campaign Types.
                                                </p>
                                            </template>
                                        </div>

                                        <template lwc:if={showEmergencyToggle}>
                                            <div class="slds-col slds-size_1-of-4 slds-p-bottom_xx-small">
                                                <div class="slds-grid slds-grid_vertical-align-center emergency-inline-toggle">
                                                    <button class={emergencyButtonClass}
                                                            onclick={handleEmergencyToggle}
                                                            title="Toggle Emergency Status">
                                                        <lightning-icon icon-name="utility:warning" size="small" variant={emergencyIconVariant}></lightning-icon>
                                                    </button>
                                                    <span class="slds-m-left_small" style="font-weight: 500; color: #1b1b1b;">Is Emergency</span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Campaign Group (required when the campaign type defines groups) -->
                                    <template lwc:if={showCampaignGroup}>
                                        <div class="slds-m-top_medium">
                                            <lightning-combobox
                                                name="campaignGroup"
                                                label="Campaign Group"
                                                placeholder="Select a campaign group..."
                                                value={selectedCampaignGroupId}
                                                options={campaignGroupOptions}
                                                onchange={handleCampaignGroupChange}
                                                required
                                                class="custom-form-input">
                                            </lightning-combobox>
                                        </div>
                                    </template>

                                    <div class="slds-m-top_medium">
                                        <lightning-input type="text" label="Campaign Name" placeholder="eg. cashloan" value={campaignName} onchange={handleNameChange} required class="custom-form-input"></lightning-input>
                                    </div>

                                    <div class="slds-grid slds-gutters slds-m-top_medium">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input
                                                type="datetime"
                                                label="Active From"
                                                value={activeFrom}
                                                onchange={handleActiveFromChange}
                                                required
                                                class="custom-form-input">
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input
                                                type="datetime"
                                                label="Active To"
                                                value={activeTo}
                                                onchange={handleActiveToChange}
                                                required
                                                class="custom-form-input">
                                            </lightning-input>
                                        </div>
                                    </div>

                                    <template lwc:if={isAlwaysOnActivation}>
                                        <div class="slds-m-top_medium">
                                            <lightning-input
                                                type="number"
                                                label="Campaign Duration (Days)"
                                                value={campaignDurationDays}
                                                onchange={handleCampaignDurationChange}
                                                min="1"
                                                step="1"
                                                required
                                                field-level-help="How long a customer should keep receiving communication from this campaign before being eligible for another."
                                                class="custom-form-input">
                                            </lightning-input>
                                        </div>
                                    </template>
                                </div>
                                </div>

                                <!-- Tile 2: Priority -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="slds-box wizard-section-box wizard-step1-tile wizard-step1-tile--priority">
                                    <span class="module-header-title">Priority</span>
                                    <div class="slds-m-top_medium priority-tile-body">
                                            <fieldset class="slds-form-element priority-tier-fieldset" role="radiogroup">
                                                <legend class="slds-form-element__legend slds-form-element__label">
                                                    Priority Tier
                                                    <abbr class="slds-required" title="required">*</abbr>
                                                </legend>
                                                <div class="slds-form-element__control priority-tier-picker-control">
                                                    <template for:each={priorityTierOptions} for:item="tier">
                                                        <div key={tier.value} class={tier.pickerClass}>
                                                            <input type="radio"
                                                                   id={tier.inputId}
                                                                   name="campaign-priority-tier"
                                                                   value={tier.value}
                                                                   checked={tier.isSelected}
                                                                   disabled={tier.isDisabled}
                                                                   onchange={handlePriorityChange} />
                                                            <label for={tier.inputId}>
                                                                <span class="slds-visual-picker__figure slds-visual-picker__text">
                                                                    <span class="tier-picker-content">
                                                                        <span class="tier-picker-inline">
                                                                            <span class="tier-picker-inline-name">{tier.label}</span>
                                                                            <template lwc:if={tier.description}>
                                                                                <span class="tier-picker-inline-desc" title={tier.description}>{tier.description}</span>
                                                                            </template>
                                                                        </span>
                                                                        <template lwc:if={tier.isDetailsExpanded}>
                                                                            <template lwc:if={tier.description}>
                                                                                <span class="slds-text-title tier-picker-description tier-picker-description-full slds-m-top_xx-small">{tier.description}</span>
                                                                            </template>
                                                                            <div class="tier-picker-details slds-m-top_x-small animate-fade-in">
                                                                                <template lwc:if={tier.hasTypes}>
                                                                                    <div class="tier-badge-row slds-m-bottom_xx-small">
                                                                                        <span class="tier-badge-group-label">Supported Campaign Types</span>
                                                                                        <div class="tier-badge-group">
                                                                                            <template for:each={tier.typeChips} for:item="chip">
                                                                                                <span key={chip} class="slds-badge slds-badge_lightest tier-type-chip">{chip}</span>
                                                                                            </template>
                                                                                        </div>
                                                                                    </div>
                                                                                </template>
                                                                                <template lwc:if={tier.attrRows.length}>
                                                                                    <div class="tier-attr-rows slds-m-bottom_xx-small">
                                                                                        <span class="tier-badge-group-label">Behavioural Attributes</span>
                                                                                        <template for:each={tier.attrRows} for:item="attr">
                                                                                            <div key={attr.key} class="tier-attr-row">
                                                                                                <span class="tier-attr-label">{attr.label}</span>
                                                                                                <span class={attr.badgeClass}>{attr.value}</span>
                                                                                            </div>
                                                                                        </template>
                                                                                    </div>
                                                                                </template>
                                                                                <template lwc:if={tier.hasExclusions}>
                                                                                    <div class="tier-badge-row">
                                                                                        <span class="tier-badge-group-label">Exclusions</span>
                                                                                        <div class="tier-badge-group">
                                                                                            <template for:each={tier.exclusionChips} for:item="chip">
                                                                                                <span key={chip} class="slds-badge tier-exclusion-badge">{chip}</span>
                                                                                            </template>
                                                                                        </div>
                                                                                    </div>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                    </span>
                                                                </span>
                                                                <span class="slds-icon_container slds-visual-picker__text-check">
                                                                    <lightning-icon icon-name="utility:check"
                                                                                    size="xx-small"
                                                                                    alternative-text=""
                                                                                    class="tier-picker-check-icon"></lightning-icon>
                                                                </span>
                                                            </label>
                                                            <!-- Outside the label so it stays clickable when the option is selected -->
                                                            <template lwc:if={tier.showLearnMore}>
                                                                <button type="button"
                                                                        class="slds-button slds-button_icon tier-details-toggle"
                                                                        data-value={tier.value}
                                                                        title={tier.detailsToggleTitle}
                                                                        aria-expanded={tier.isDetailsExpanded}
                                                                        onclick={handleTierDetailsToggle}>
                                                                    <lightning-icon icon-name={tier.detailsChevron}
                                                                                    size="xx-small"
                                                                                    alternative-text={tier.detailsToggleTitle}></lightning-icon>
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </fieldset>
                                    </div>
                                </div>
                                </div>

                                <!-- Tile 3: Exclusions -->
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="slds-box wizard-section-box wizard-step1-tile wizard-step1-tile--exclusions">
                                    <span class="module-header-title">Exclusions</span>
                                    <template lwc:if={showExclusionsSection}>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small slds-m-bottom_small">
                                            Configure exclusions allowed for the selected priority tier.
                                        </p>
                                        <div class="exclusions-tile-body animate-fade-in">
                                            <template lwc:if={showOtherMarketingActivationsOption}>
                                                <div class="exclusion-method-box slds-m-bottom_small">
                                                    <span class="exclusion-method-title">Exclude other marketing activations</span>
                                                    <lightning-input
                                                        type="checkbox"
                                                        label="Other Marketing Activations"
                                                        checked={excludeOtherMarketingActivations}
                                                        onchange={handleOtherMarketingActivationsChange}
                                                        class="slds-m-top_x-small exclusion-other-marketing-checkbox">
                                                    </lightning-input>
                                                </div>
                                            </template>
                                            <template lwc:if={showManualExclusionDefinitions}>
                                                <div class="exclusion-method-box exclusion-method-box--manual">
                                                    <span class="exclusion-method-title">Manual exclusions</span>
                                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small slds-m-bottom_small">
                                                        Switch between sources and select records. Everything you choose appears in the summary below.
                                                    </p>
                                                    <template for:each={exclusionWorkspaceRows} for:item="row">
                                                        <div key={row.id} class="exclusion-source-picker-block">
                                                            <label class="slds-form-element__label custom-label-style">Exclusion source</label>
                                                            <div class="slds-button-group exclusion-source-group slds-m-top_xx-small slds-m-bottom_x-small" role="group" aria-label="Exclusion source">
                                                                <template for:each={row.exclusionSourceOptions} for:item="srcOpt">
                                                                    <button
                                                                        key={srcOpt.value}
                                                                        type="button"
                                                                        class={srcOpt.btnClass}
                                                                        data-value={srcOpt.value}
                                                                        title={srcOpt.label}
                                                                        onclick={handleExclusionSourcePick}>
                                                                        <lightning-icon icon-name={srcOpt.icon} size="x-small"></lightning-icon>
                                                                        <span class="exclusion-source-btn-label">{srcOpt.shortLabel}</span>
                                                                    </button>
                                                                </template>
                                                            </div>
                                                            <template lwc:if={exclusionActiveCatalogHint}>
                                                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">{exclusionActiveCatalogHint}</p>
                                                            </template>
                                                            <div class="exclusion-lookup-col slds-m-top_x-small">
                                                                    <template lwc:if={row.isCampaign}>
                                                                        <div class={row.campaignPickerContainerClass} data-row-id={row.id}>
                                                                            <label class="slds-form-element__label" for={row.id}>Salesforce Campaigns</label>
                                                                            <div class="slds-form-element__control">
                                                                                <div class="slds-combobox_container">
                                                                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                                                                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                                                            <input
                                                                                                type="text"
                                                                                                id={row.id}
                                                                                                class="slds-input slds-combobox__input custom-form-input"
                                                                                                placeholder="Search campaigns..."
                                                                                                autocomplete="off"
                                                                                                value={row.campaignSearchTerm}
                                                                                                data-row-id={row.id}
                                                                                                onclick={handleCampaignPickerToggle}
                                                                                                oninput={handleCampaignPickerSearch}
                                                                                            />
                                                                                            <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                                                                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                                                            </span>
                                                                                        </div>
                                                                                        <template lwc:if={row.campaignPickerOpen}>
                                                                                            <div class="custom-picklist-dropdown exclusion-campaign-dropdown" role="listbox">
                                                                                                <div class="dropdown-scrollable-list">
                                                                                                    <template for:each={row.filteredCampaignPickerRows} for:item="camp">
                                                                                                        <div key={camp.id} class="exclusion-campaign-option-row">
                                                                                                            <label class="exclusion-campaign-option-label custom-dropdown-row">
                                                                                                                <input
                                                                                                                    type="checkbox"
                                                                                                                    class="exclusion-campaign-checkbox"
                                                                                                                    checked={camp.isSelected}
                                                                                                                    data-row-id={row.id}
                                                                                                                    data-campaign-id={camp.id}
                                                                                                                    onchange={handleCampaignExclusionToggle}
                                                                                                                />
                                                                                                                <span class="exclusion-campaign-option-text">
                                                                                                                    <span class="list-campaign-title">{camp.name}</span>
                                                                                                                    <template lwc:if={camp.metaLine}>
                                                                                                                        <span class="exclusion-campaign-meta">{camp.metaLine}</span>
                                                                                                                    </template>
                                                                                                                </span>
                                                                                                            </label>
                                                                                                            <template lwc:if={camp.showGroupAction}>
                                                                                                                <button
                                                                                                                    type="button"
                                                                                                                    class="exclusion-campaign-group-link"
                                                                                                                    data-row-id={row.id}
                                                                                                                    data-group-key={camp.groupKey}
                                                                                                                    onclick={handleSelectAllCampaignsInGroup}>
                                                                                                                    Select all in group
                                                                                                                </button>
                                                                                                            </template>
                                                                                                        </div>
                                                                                                    </template>
                                                                                                </div>
                                                                                            </div>
                                                                                        </template>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                    <template lwc:elseif={row.isReport}>
                                                                        <div class={row.reportPickerContainerClass} data-row-id={row.id}>
                                                                            <label class="slds-form-element__label">Salesforce Reports</label>
                                                                            <div class="slds-form-element__control">
                                                                                <div class="slds-combobox_container">
                                                                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                                                                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                                                            <input
                                                                                                type="text"
                                                                                                class="slds-input slds-combobox__input custom-form-input"
                                                                                                placeholder="Search reports..."
                                                                                                autocomplete="off"
                                                                                                value={row.reportSearchTerm}
                                                                                                data-row-id={row.id}
                                                                                                onclick={handleReportPickerToggle}
                                                                                                oninput={handleReportPickerSearch}
                                                                                            />
                                                                                            <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                                                                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                                                            </span>
                                                                                        </div>
                                                                                        <template lwc:if={row.reportPickerOpen}>
                                                                                            <div class="custom-picklist-dropdown exclusion-picker-dropdown" role="listbox">
                                                                                                <div class="dropdown-scrollable-list">
                                                                                                    <template for:each={row.filteredReportPickerRows} for:item="rep">
                                                                                                        <div key={rep.id} class="exclusion-picker-option-row">
                                                                                                            <label class="exclusion-picker-option-label custom-dropdown-row">
                                                                                                                <input
                                                                                                                    type="checkbox"
                                                                                                                    class="exclusion-picker-checkbox"
                                                                                                                    checked={rep.isSelected}
                                                                                                                    data-row-id={row.id}
                                                                                                                    data-report-id={rep.id}
                                                                                                                    onchange={handleReportExclusionToggle}
                                                                                                                />
                                                                                                                <span class="exclusion-picker-option-text">
                                                                                                                    <span class="list-campaign-title">{rep.name}</span>
                                                                                                                    <template lwc:if={rep.metaLine}>
                                                                                                                        <span class="exclusion-campaign-meta">{rep.metaLine}</span>
                                                                                                                    </template>
                                                                                                                </span>
                                                                                                            </label>
                                                                                                        </div>
                                                                                                    </template>
                                                                                                </div>
                                                                                            </div>
                                                                                        </template>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                    <template lwc:elseif={row.isSegment}>
                                                                        <div class={row.segmentPickerContainerClass} data-row-id={row.id}>
                                                                            <label class="slds-form-element__label">Data360 Segments</label>
                                                                            <div class="slds-form-element__control">
                                                                                <div class="slds-combobox_container">
                                                                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                                                                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                                                            <input
                                                                                                type="text"
                                                                                                class="slds-input slds-combobox__input custom-form-input"
                                                                                                placeholder="Search segments..."
                                                                                                autocomplete="off"
                                                                                                value={row.segmentSearchTerm}
                                                                                                data-row-id={row.id}
                                                                                                onclick={handleSegmentPickerToggle}
                                                                                                oninput={handleSegmentPickerSearch}
                                                                                            />
                                                                                            <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                                                                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                                                            </span>
                                                                                        </div>
                                                                                        <template lwc:if={row.segmentPickerOpen}>
                                                                                            <div class="custom-picklist-dropdown exclusion-picker-dropdown" role="listbox">
                                                                                                <div class="dropdown-scrollable-list">
                                                                                                    <template for:each={row.filteredSegmentPickerRows} for:item="seg">
                                                                                                        <div key={seg.id} class="exclusion-picker-option-row">
                                                                                                            <label class="exclusion-picker-option-label custom-dropdown-row">
                                                                                                                <input
                                                                                                                    type="checkbox"
                                                                                                                    class="exclusion-picker-checkbox"
                                                                                                                    checked={seg.isSelected}
                                                                                                                    data-row-id={row.id}
                                                                                                                    data-segment-id={seg.id}
                                                                                                                    onchange={handleSegmentExclusionToggle}
                                                                                                                />
                                                                                                                <span class="exclusion-picker-option-text">
                                                                                                                    <span class="list-campaign-title">{seg.name}</span>
                                                                                                                    <template lwc:if={seg.metaLine}>
                                                                                                                        <span class="exclusion-campaign-meta">{seg.metaLine}</span>
                                                                                                                    </template>
                                                                                                                </span>
                                                                                                            </label>
                                                                                                        </div>
                                                                                                    </template>
                                                                                                </div>
                                                                                            </div>
                                                                                        </template>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                    <template lwc:elseif={row.isDmo}>
                                                                        <template lwc:if={exclusionDmoInfoMessage}>
                                                                            <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_x-small" role="status">
                                                                                <span class="slds-assistive-text">info</span>
                                                                                <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small slds-no-flex" alternative-text="Info"></lightning-icon>
                                                                                <span class="slds-text-body_small">{exclusionDmoInfoMessage}</span>
                                                                            </div>
                                                                        </template>
                                                                        <div class={row.dmoPickerContainerClass} data-row-id={row.id}>
                                                                            <label class="slds-form-element__label">Data360 DMOs</label>
                                                                            <div class="slds-form-element__control">
                                                                                <div class="slds-combobox_container">
                                                                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                                                                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                                                            <input
                                                                                                type="text"
                                                                                                class="slds-input slds-combobox__input custom-form-input"
                                                                                                placeholder="Type DMO label or API name (min 2 chars)..."
                                                                                                autocomplete="off"
                                                                                                value={row.dmoSearchTerm}
                                                                                                data-row-id={row.id}
                                                                                                onclick={handleDmoPickerToggle}
                                                                                                oninput={handleDmoPickerSearch}
                                                                                            />
                                                                                            <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                                                                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                                                            </span>
                                                                                        </div>
                                                                                        <template lwc:if={row.dmoPickerOpen}>
                                                                                            <div class="custom-picklist-dropdown exclusion-picker-dropdown" role="listbox">
                                                                                                <div class="dropdown-scrollable-list">
                                                                                                    <template for:each={row.filteredDmoPickerRows} for:item="dmo">
                                                                                                        <div key={dmo.id} class="exclusion-picker-option-row">
                                                                                                            <label class="exclusion-picker-option-label custom-dropdown-row">
                                                                                                                <input
                                                                                                                    type="checkbox"
                                                                                                                    class="exclusion-picker-checkbox"
                                                                                                                    checked={dmo.isSelected}
                                                                                                                    data-row-id={row.id}
                                                                                                                    data-dmo-id={dmo.id}
                                                                                                                    onchange={handleDmoExclusionToggle}
                                                                                                                />
                                                                                                                <span class="exclusion-picker-option-text">
                                                                                                                    <span class="list-campaign-title">{dmo.name}</span>
                                                                                                                    <template lwc:if={dmo.metaLine}>
                                                                                                                        <span class="exclusion-campaign-meta">{dmo.metaLine}</span>
                                                                                                                    </template>
                                                                                                                </span>
                                                                                                            </label>
                                                                                                        </div>
                                                                                                    </template>
                                                                                                </div>
                                                                                            </div>
                                                                                        </template>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                    <template lwc:elseif={row.isDlo}>
                                                                        <template lwc:if={exclusionDloInfoMessage}>
                                                                            <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_x-small" role="status">
                                                                                <span class="slds-assistive-text">info</span>
                                                                                <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small slds-no-flex" alternative-text="Info"></lightning-icon>
                                                                                <span class="slds-text-body_small">{exclusionDloInfoMessage}</span>
                                                                            </div>
                                                                        </template>
                                                                        <div class={row.dloPickerContainerClass} data-row-id={row.id}>

                                                                            <div class="slds-form-element__control">
                                                                                <div class="slds-combobox_container">
                                                                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                                                                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                                                            <input
                                                                                                type="text"
                                                                                                class="slds-input slds-combobox__input custom-form-input"
                                                                                                placeholder="Type DLO label or API name (min 2 chars)..."
                                                                                                autocomplete="off"
                                                                                                value={row.dloSearchTerm}
                                                                                                data-row-id={row.id}
                                                                                                onclick={handleDloPickerToggle}
                                                                                                oninput={handleDloPickerSearch}
                                                                                            />
                                                                                            <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                                                                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                                                                            </span>
                                                                                        </div>
                                                                                        <template lwc:if={row.dloPickerOpen}>
                                                                                            <div class="custom-picklist-dropdown exclusion-picker-dropdown" role="listbox">
                                                                                                <div class="dropdown-scrollable-list">
                                                                                                    <template for:each={row.filteredDloPickerRows} for:item="dlo">
                                                                                                        <div key={dlo.id} class="exclusion-picker-option-row">
                                                                                                            <label class="exclusion-picker-option-label custom-dropdown-row">
                                                                                                                <input
                                                                                                                    type="checkbox"
                                                                                                                    class="exclusion-picker-checkbox"
                                                                                                                    checked={dlo.isSelected}
                                                                                                                    data-row-id={row.id}
                                                                                                                    data-dlo-id={dlo.id}
                                                                                                                    onchange={handleDloExclusionToggle}
                                                                                                                />
                                                                                                                <span class="exclusion-picker-option-text">
                                                                                                                    <span class="list-campaign-title">{dlo.name}</span>
                                                                                                                    <template lwc:if={dlo.metaLine}>
                                                                                                                        <span class="exclusion-campaign-meta">{dlo.metaLine}</span>
                                                                                                                    </template>
                                                                                                                </span>
                                                                                                            </label>
                                                                                                        </div>
                                                                                                    </template>
                                                                                                </div>
                                                                                            </div>
                                                                                        </template>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                            </div>
                                                        </div>
                                                    </template>

                                                    <template lwc:if={exclusionHasSelectedRecords}>
                                                        <div class="exclusion-selected-divider slds-m-top_medium slds-m-bottom_small" role="separator"></div>
                                                        <lightning-input
                                                            label="Campaign member key"
                                                            field-level-help="Column on the campaign qualification source (Data Graph or segment) that identifies each member. All exclusions below match to this key."
                                                            value={exclusionCampaignMemberKey}
                                                            onchange={handleCampaignMemberKeyChange}
                                                            class="slds-m-bottom_small exclusion-campaign-member-key">
                                                        </lightning-input>
                                                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                                            Select the attribute on each exclusion source that corresponds to the campaign member key. For suppression campaigns, use Campaign Member fields or related Contact keys (e.g. External Customer Id).
                                                        </p>
                                                        <ul class="exclusion-summary-list" role="list">
                                                            <template for:each={exclusionSummaryListItems} for:item="item">
                                                                <li key={item.key} class={item.rowClass} role="listitem">
                                                                    <lightning-icon icon-name={item.icon} size="x-small" class="exclusion-summary-icon"></lightning-icon>
                                                                    <span class="exclusion-summary-name" title={item.sourceName}>{item.sourceName}</span>
                                                                    <template lwc:if={item.hasFieldOptions}>
                                                                        <lightning-combobox
                                                                            variant="label-hidden"
                                                                            placeholder="Select attribute..."
                                                                            options={item.fieldOptions}
                                                                            value={item.foreignKeyColumn}
                                                                            data-source={item.source}
                                                                            data-record-id={item.recordId}
                                                                            onchange={handleExclusionForeignKeyChange}
                                                                            class="exclusion-summary-attribute">
                                                                        </lightning-combobox>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <lightning-spinner alternative-text="Loading attributes" size="x-small"></lightning-spinner>
                                                                    </template>
                                                                    <button type="button" class="slds-button slds-button_icon slds-button_icon-x-small exclusion-summary-remove" title="Remove" data-source={item.source} data-record-id={item.recordId} onclick={handleRemoveExclusionSelection}>
                                                                        <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Remove"></lightning-icon>
                                                                    </button>
                                                                </li>
                                                            </template>
                                                        </ul>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium exclusions-tile-empty">
                                            Exclusion options appear when the selected tier allows manual exclusions or other marketing activations in Campaign Dictionary → Tiers.
                                        </p>
                                    </template>
                                </div>
                                </div>

                            </div>
                        </template>

                        <!-- STEP 2: Topic & Offering -->
                        <template lwc:if={isStep2}>
                            <div class="form-module-card slds-m-bottom_large" style="z-index: 99;">
                                
                                <!-- Topic Name -->
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label" for="topic-combobox">Topic Name</label>
                                    <div class="slds-form-element__control">
                                        
                                        <div class="slds-combobox_container">
                                            <div class={comboboxClass} aria-expanded={isTopicDropdownOpen} aria-haspopup="listbox" role="combobox">
                                                
                                                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                    <input type="text" 
                                                        id="topic-combobox"
                                                        class="slds-input slds-combobox__input" 
                                                        placeholder="Select or search a topic..." 
                                                        autocomplete="off"
                                                        role="textbox"
                                                        value={topicName}
                                                        onclick={handleTopicDropdownToggle} 
                                                        oninput={handleTopicSearch} />
                                                    <span class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right">
                                                        <lightning-icon icon-name="utility:down" size="x-small" class="slds-icon slds-icon-text-default"></lightning-icon>
                                                    </span>
                                                </div>

                                                <!-- Dropdown List -->
                                                <div class="slds-dropdown slds-dropdown_fluid slds-dropdown_length-5" role="listbox">
                                                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                        <template for:each={filteredTopicGoals} for:item="goal">
                                                            <li key={goal.id} role="presentation" class="slds-listbox__item" data-id={goal.id} data-name={goal.name} onclick={handleSelectTopic}>
                                                                <!-- Standard SLDS entity layout (Icon on left, text on right) -->
                                                                <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
                                                                    <span class="slds-media__figure slds-listbox__option-icon">
                                                                        <lightning-icon icon-name="utility:topic" size="small"></lightning-icon>
                                                                    </span>
                                                                    <span class="slds-media__body">
                                                                        <span class="slds-listbox__option-text slds-listbox__option-text_entity">{goal.label}</span>
                                                                    </span>
                                                                </div>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                                
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">

                                    <div class="slds-col slds-size_1-of-2">
                                        <div class="slds-box">
                                            <fieldset class="slds-form-element" role="radiogroup">
                                                <legend class="slds-form-element__legend slds-form-element__label">Offering Type</legend>
                                                <div class="slds-form-element__control">
                                                    <div class="slds-radio_button-group">
                                                        <template for:each={offeringTypeOptions} for:item="offering">
                                                            <span class="slds-button slds-radio_button" key={offering.value}>
                                                                <input 
                                                                    name="offering-type" 
                                                                    type="radio" 
                                                                    id={offering.uniqueId} 
                                                                    value={offering.value} 
                                                                    checked={offering.isChecked} 
                                                                    onchange={handleOfferingTypeChange} 
                                                                />
                                                                <!-- Removed the onclick from the label -->
                                                                <label class="slds-radio_button__label" for={offering.uniqueId}>
                                                                    <span class="slds-radio_faux">{offering.label}</span>
                                                                </label>
                                                            </span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </fieldset>
                                        
                                            <!-- Product Family Section -->
                                            <template lwc:if={isOfferingProductFamily}>
                                                <div class="slds-m-top_medium animate-fade-in">
                                                    <label class="slds-form-element__label custom-label-style">Select Target Product Families</label>
                                                    <div class="slds-box slds-theme_default slds-m-top_xx-small" style="background: #f9f9f9;">
                                                        <!-- Filter Bar -->
                                                        <div class="pf-filter-bar slds-p-bottom_small" style="border-bottom: 1px solid #dddbda;">
                                                            <div class="slds-grid slds-wrap slds-grid_vertical-align-end slds-gutters_x-small">
                                                                <div class="slds-col slds-size_1-of-2">
                                                                    <label class="pf-filter-label">Customer Type</label>
                                                                    <div class="pf-filter-pills">
                                                                        <template for:each={customerTypeFilterOptions} for:item="ctf">
                                                                            <span key={ctf.value} class={ctf.className} data-value={ctf.value} onclick={handleCustomerTypeFilter}>{ctf.label}</span>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                                <div class="slds-col slds-size_1-of-2">
                                                                    <label class="pf-filter-label">Record Type</label>
                                                                    <div class="pf-filter-pills">
                                                                        <template for:each={recordTypeFilterBadgeOptions} for:item="rtf">
                                                                            <span key={rtf.value} class={rtf.className} data-value={rtf.value} onclick={handleRecordTypeFilterBadge}>{rtf.label}</span>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <!-- Master Toggle Row -->
                                                        <div class="slds-p-vertical_small select-all-row-divider" style="border-bottom: 1px solid #dddbda;">
                                                            <lightning-input type="checkbox" label="Select All" checked={selectAllProductFamilies} onchange={handleSelectAllProductFamilies} class="custom-master-checkbox"></lightning-input>
                                                        </div>

                                                        <template for:each={filteredGroupedProductFamilyOptions} for:item="group">
                                                            <div key={group.recordType} class="slds-m-top_medium">
                                                                <span class="pf-group-header">{group.recordType}</span>
                                                                <div class="slds-grid pf-group-body slds-wrap slds-m-top_x-small">
                                                                    <template for:each={group.items} for:item="pf">
                                                                        <div key={pf.value} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_x-small">
                                                                            <div class="slds-form-element">
                                                                                <div class="slds-form-element__control">
                                                                                    <div class="slds-checkbox">
                                                                                        <input type="checkbox" id={pf.inputId} checked={pf.checked} data-value={pf.value} onchange={handleProductFamilyChange} style="position: absolute; opacity: 0; width: 0; height: 0;" />
                                                                                        <label class="slds-checkbox__label" for={pf.inputId} style="display: inline-flex; align-items: flex-start; width: 100%;">
                                                                                            <span class="slds-checkbox_faux"></span>
                                                                                            <span class="slds-form-element__label pf-checkbox-label-wrapper" style="padding-top:0;">
                                                                                                <span class="pf-label-text">{pf.label}</span>
