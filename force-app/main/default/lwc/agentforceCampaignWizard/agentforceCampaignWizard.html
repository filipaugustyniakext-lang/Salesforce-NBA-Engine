                                                                                                <span class="pf-badge-group">
                                                                                                    <template for:each={pf.fons} for:item="fon">
                                                                                                        <span key={fon} class="slds-badge pf-fon-badge">{fon}</span>
                                                                                                    </template>
                                                                                                    <template for:each={pf.customerTypes} for:item="ct">
                                                                                                        <span key={ct} class="slds-badge pf-customer-type-badge">{ct}</span>
                                                                                                    </template>
                                                                                                </span>
                                                                                            </span>
                                                                                        </label>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- Family of Needs Section -->
                                            <template lwc:if={isOfferingFamilyOfNeeds}>
                                                <div class="slds-m-top_medium animate-fade-in">
                                                    <label class="slds-form-element__label custom-label-style">Select Target Family of Needs</label>
                                                    <div class="slds-box slds-theme_default slds-m-top_xx-small" style="background: #f9f9f9;">
                                                        <!-- Customer Type Filter -->
                                                        <template lwc:if={fonCustomerTypeFilterOptions.length}>
                                                            <div class="pf-filter-bar slds-p-bottom_small" style="border-bottom: 1px solid #dddbda;">
                                                                <label class="pf-filter-label">Customer Type</label>
                                                                <div class="pf-filter-pills">
                                                                    <template for:each={fonCustomerTypeFilterOptions} for:item="ctf">
                                                                        <span key={ctf.value} class={ctf.className} data-value={ctf.value} onclick={handleFonCustomerTypeFilter}>{ctf.label}</span>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </template>

                                                        <!-- Master Toggle Row -->
                                                        <div class="slds-p-vertical_small select-all-row-divider" style="border-bottom: 1px solid #dddbda;">
                                                            <lightning-input type="checkbox" label="Select All" checked={selectAllFamilyOfNeeds} onchange={handleSelectAllFamilyOfNeeds} class="custom-master-checkbox"></lightning-input>
                                                        </div>

                                                        <div class="slds-grid slds-wrap slds-m-top_small">
                                                            <template for:each={filteredFamilyOfNeedsOptions} for:item="fon">
                                                                <div key={fon.value} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_x-small">
                                                                    <div class="slds-form-element">
                                                                        <div class="slds-form-element__control">
                                                                            <div class="slds-checkbox fon-checkbox-wrapper">
                                                                                <input type="checkbox" id={fon.inputId} checked={fon.checked} data-value={fon.value} onchange={handleFamilyOfNeedsChange} style="position: absolute; opacity: 0; width: 0; height: 0;" />
                                                                                <label class="slds-checkbox__label" for={fon.inputId} style="display: inline-flex; align-items: flex-start; width: 100%; margin: 0;">
                                                                                    <span class="slds-checkbox_faux"></span>
                                                                                    <span class="slds-form-element__label pf-checkbox-label-wrapper" style="padding-top:0;">
                                                                                        <span class="fon-label-line">
                                                                                            <span class="pf-label-text">{fon.label}</span>
                                                                                            <span class="fon-tooltip-container" data-tooltip={fon.tooltip} onclick={handleIconClick}>
                                                                                                <lightning-icon icon-name="utility:info" size="x-small" class="fon-info-icon"></lightning-icon>
                                                                                            </span>
                                                                                        </span>
                                                                                        <span class="pf-badge-group">
                                                                                            <template for:each={fon.customerTypes} for:item="ct">
                                                                                                <span key={ct} class="slds-badge pf-customer-type-badge">{ct}</span>
                                                                                            </template>
                                                                                        </span>
                                                                                    </span>
                                                                                </label>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    
                                    <div class="slds-col slds-size_1-of-2">
                                        <div class="slds-box">
                                            <!-- Header: title + search + live count -->
                                            <div class="slds-p-vertical_x-small slds-p-horizontal_medium slds-shrink-none slds-theme_shade offer-list-builder-header">
                                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                    <span class="module-header-title">Matching Active Offers</span>
                                                    <template lwc:if={isLoadingOffers}>
                                                        <lightning-spinner size="x-small" alternative-text="Loading offers" variant="brand" class="slds-m-left_small"></lightning-spinner>
                                                    </template>
                                                </div>
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label slds-assistive-text" for="offer-list-search">Search</label>
                                                    <div class="slds-form-element__control">
                                                        <div class="slds-combobox_container">
                                                            <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                                                                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                                                                    <input
                                                                        class="slds-input slds-combobox__input custom-form-input"
                                                                        id="offer-list-search"
                                                                        type="text"
                                                                        placeholder="Search offers..."
                                                                        autocomplete="off"
                                                                        value={offerSearchTerm}
                                                                        oninput={handleOfferSearch} />
                                                                    <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                                                        <lightning-icon icon-name="utility:search" size="x-small" class="slds-icon-text-default"></lightning-icon>
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="slds-text-title slds-m-top_x-small" aria-live="polite">{selectedOffersCount} Item(s) Selected</div>
                                                <div class="slds-text-title offer-list-builder-note slds-m-top_xx-small" aria-live="polite">
                                                    <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                                    Only currently-active offers are shown. Deactivated or expired offers are automatically dropped from this campaign.
                                                </div>
                                            </div>

                                            <!-- Interactive list builder table -->
                                            <div class="slds-scrollable slds-grow offer-list-builder-scroll">
                                                <div class="slds-scrollable_none">
                                                    <table
                                                        aria-multiselectable="true"
                                                        class="slds-table slds-table_header-hidden slds-no-row-hover slds-table_bordered"
                                                        role="grid"
                                                        aria-label="Matching Active Offers">
                                                        <thead class="slds-assistive-text">
                                                            <tr class="slds-line-height_reset">
                                                                <th scope="col" style="width:3.75rem"></th>
                                                                <th scope="col"><div class="slds-truncate" title="Offer Name">Offer Name</div></th>
                                                                <th scope="col" style="width:6rem"><div class="slds-truncate" title="Actions">Actions</div></th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template lwc:if={filteredMatchingOffers.length}>
                                                                <template for:each={filteredMatchingOffers} for:item="offer">
                                                                    <tr key={offer.id} aria-selected={offer.selected} class={offer.rowClass}>
                                                                        <td class="slds-text-align_right" role="gridcell" style="width:3.75rem">
                                                                            <button
                                                                                class="slds-button slds-button_icon slds-button_icon-border-filled offer-add-btn"
                                                                                data-id={offer.id}
                                                                                title={offer.toggleTitle}
                                                                                onclick={handleOfferToggle}>
                                                                                <lightning-icon icon-name={offer.toggleIcon} size="xx-small"></lightning-icon>
                                                                                <span class="slds-assistive-text">{offer.toggleAssistive}</span>
                                                                            </button>
                                                                        </td>
                                                                        <td role="gridcell" class="slds-p-horizontal_medium">
                                                                            <div class="offer-name-cell">
                                                                                <span class="slds-truncate slds-truncate_container_75 offer-name-text" title={offer.name}>{offer.name}</span>
                                                                                <span class="fon-tooltip-container offer-match-tooltip" data-tooltip={offer.matchReason} tabindex="0" onclick={handleIconClick}>
                                                                                    <lightning-icon icon-name="utility:info" size="x-small" class="fon-info-icon" alternative-text="Why this offer matches"></lightning-icon>
                                                                                </span>
                                                                            </div>
                                                                        </td>
                                                                        <td class="slds-text-align_right slds-p-horizontal_x-small" role="gridcell" style="width:6rem">
                                                                            <lightning-button data-id={offer.id} label="Modify" title="Modify Offer" icon-name="utility:new_window" class="slds-m-left_x-small"></lightning-button>
                                                                        </td>
                                                                    </tr>
                                                                </template>
                                                            </template>
                                                            <template lwc:else>
                                                                <tr>
                                                                    <td colspan="3" class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                                                                        <template lwc:if={isLoadingOffers}>Loading…</template>
                                                                        <template lwc:else>No active offers currently match the selected families.</template>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                
                                
                                
                            </div>
                        </template>
                        
                        <!-- STEP 3: Channels & Copy -->
                        <template lwc:if={isStep3}>
                                    <div class="form-module-card slds-m-bottom_large">
                                        <span class="module-header-title">Channels &amp; Copy</span>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small slds-m-bottom_medium">
                                            Enable channels with the toggles, then assign published message variants per channel.
                                        </p>

                                        <div class="copy-assignment-layout slds-grid">
                                            <!-- Vertical Channel Tabs (all active dictionary channel types) -->
                                            <div class="slds-col slds-size_1-of-6 copy-tabs-sidebar">
                                                <div class="copy-channel-sidebar" role="tablist" aria-orientation="vertical">
                                                    <template for:each={copyChannelTabs} for:item="tab">
                                                        <div key={tab.value} class={tab.rowClass} title={tab.label}>
                                                            <div class="copy-channel-toggle-slot">
                                                                <lightning-input
                                                                    type="toggle"
                                                                    variant="label-hidden"
                                                                    message-toggle-active=""
                                                                    message-toggle-inactive=""
                                                                    label={tab.label}
                                                                    checked={tab.enabled}
                                                                    data-value={tab.value}
                                                                    onchange={handleCopyChannelEnableToggle}
                                                                    class="copy-channel-tab-toggle"
                                                                    title="Enable channel">
                                                                </lightning-input>
                                                            </div>
                                                            <a class={tab.linkClass}
                                                               role="tab"
                                                               aria-selected={tab.isActiveTab}
                                                               data-value={tab.value}
                                                               onclick={handleCopyChannelSelect}>
                                                                <span class="slds-vertical-tabs__left-icon">
                                                                    <lightning-icon icon-name={tab.icon} size="x-small"></lightning-icon>
                                                                </span>
                                                                <span class="slds-truncate">{tab.label}</span>
                                                                <template lwc:if={tab.selectedCount}>
                                                                    <span class="slds-badge slds-m-left_x-small cockpit-badge-ready">{tab.selectedCount}</span>
                                                                </template>
                                                            </a>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>

                                            <!-- List Builder Area -->
                                            <div class="slds-col slds-size_5-of-6 copy-list-builder-container">
                                                <div class="offer-list-builder-card copy-assignment-list-card">
                                                    <div class="slds-theme_shade copy-assignment-list-header">
                                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                            <span class="module-header-title">{activeCopyChannelLabel} — Published Variants</span>
                                                            <template lwc:if={isLoadingCopy}>
                                                                <lightning-spinner size="x-small" alternative-text="Loading copy" variant="brand" class="slds-m-left_small"></lightning-spinner>
                                                            </template>
                                                        </div>
                                                        <div class="slds-text-title">{activeChannelSelectedCopyCount} Item(s) Selected</div>
                                                        <div class="slds-text-title offer-list-builder-note slds-m-top_xx-small" aria-live="polite">
                                                            <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                                            Published Copy Center messages matching your Step 2 product families and/or selected offers.
                                                        </div>
                                                    </div>
                                                    <div class="copy-assignment-list-scroll">
                                                        <div class="slds-scrollable_none">
                                                            <table
                                                                aria-multiselectable="true"
                                                                class="slds-table slds-table_cell-buffer slds-table_bordered copy-assignment-table"
                                                                role="grid"
                                                                aria-label={activeCopyChannelLabel}>
                                                                <thead>
                                                                    <tr class="slds-line-height_reset">
                                                                        <th scope="col" class="copy-assignment-col-select" aria-label="Select"></th>
                                                                        <th scope="col"><div class="slds-truncate" title="Message Name">Message Name</div></th>
                                                                        <th scope="col" class="copy-assignment-col-variant"><div class="slds-truncate" title="Message Variant">Variant #</div></th>
                                                                        <th scope="col" class="copy-assignment-col-weight"><div class="slds-truncate" title="Display Weight">Weight</div></th>
                                                                        <th scope="col" class="copy-assignment-col-normalized"><div class="slds-truncate" title="Normalized Weight">Normalized Weight</div></th>
                                                                        <th scope="col" class="copy-assignment-col-status"><div class="slds-truncate" title="Status">Status</div></th>
                                                                        <th scope="col" class="copy-assignment-col-open" aria-label="Open in Copy Center"></th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    <template lwc:if={activeChannelCopyVariants.length}>
                                                                        <template for:each={activeChannelCopyVariants} for:item="variant">
                                                                            <tr key={variant.id} aria-selected={variant.selected} class={variant.rowClass}>
                                                                                <td class="slds-text-align_right" role="gridcell" style="width:3.75rem">
                                                                                    <button
                                                                                        class="slds-button slds-button_icon slds-button_icon-border-filled offer-add-btn"
                                                                                        data-id={variant.id}
                                                                                        title={variant.toggleTitle}
                                                                                        onclick={handleCopyVariantToggle}>
                                                                                        <lightning-icon icon-name={variant.toggleIcon} size="xx-small"></lightning-icon>
                                                                                        <span class="slds-assistive-text">{variant.toggleAssistive}</span>
                                                                                    </button>
                                                                                </td>
                                                                                <td role="gridcell" class="slds-p-horizontal_small">
                                                                                    <div class="slds-truncate" title={variant.messageName}>{variant.messageName}</div>
                                                                                </td>
                                                                                <td role="gridcell">
                                                                                    <span class="slds-truncate" title={variant.variantNumber}>{variant.variantNumber}</span>
                                                                                </td>
                                                                                <td role="gridcell">
                                                                                    <span class="slds-truncate" title={variant.weight}>{variant.weight}</span>
                                                                                </td>
                                                                                <td role="gridcell">
                                                                                    <span class="slds-truncate" title={variant.normalizedWeight}>{variant.normalizedWeight}</span>
                                                                                </td>
                                                                                <td role="gridcell">
                                                                                    <span class={variant.statusClass}>{variant.status}</span>
                                                                                </td>
                                                                                <td class="slds-text-align_right" role="gridcell">
                                                                                    <button
                                                                                        type="button"
                                                                                        class="slds-button slds-button_icon slds-button_icon-border"
                                                                                        data-id={variant.id}
                                                                                        title="Open in Copy Center"
                                                                                        onclick={handleCopyVariantPreview}>
                                                                                        <lightning-icon icon-name="utility:chevronright" size="xx-small" alternative-text="Open in Copy Center"></lightning-icon>
                                                                                        <span class="slds-assistive-text">Open in Copy Center</span>
                                                                                    </button>
                                                                                </td>
                                                                            </tr>
                                                                        </template>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <tr>
                                                                            <td colspan="7" class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                                                                                <template lwc:if={isLoadingCopy}>Loading…</template>
                                                                                <template lwc:elseif={isActiveCopyChannelEnabled}>No published variants match your offerings for this channel.</template>
                                                                                <template lwc:else>{copyChannelDisabledHint}</template>
                                                                            </td>
                                                                        </tr>
                                                                    </template>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                        </template>

                        <!-- STEP 4: Scoring Settings -->
                        <template lwc:if={isStep4}>
                            <div class="form-module-card slds-m-bottom_large">
                                <span class="module-header-title">Scoring Settings</span>

                                <div class="scoring-content-box slds-m-top_medium">
                                    <lightning-radio-group
                                        name="scoringConfigurationMethod"
                                        label="Scoring method"
                                        options={scoringConfigurationOptions}
                                        value={scoringConfigurationMethod}
                                        type="button"
                                        onchange={handleScoringConfigurationMethodChange}
                                        class="slds-m-bottom_medium">
                                    </lightning-radio-group>

                                    <template lwc:if={isScoringModelConfiguration}>
                                        <template lwc:if={hasScoringModels}>
                                            <lightning-combobox
                                                name="scoringModel"
                                                label="Scoring Model"
                                                placeholder="Select a scoring model from the dictionary"
                                                value={selectedScoringModelId}
                                                options={scoringModelOptions}
                                                onchange={handleScoringModelChange}
                                                required
                                                class="custom-form-input">
                                            </lightning-combobox>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                                                <span class="slds-assistive-text">warning</span>
                                                <h2>{scoringModelEmptyMessage}</h2>
                                            </div>
                                        </template>
                                    </template>

                                    <template lwc:if={isAprioriScoreConfiguration}>
                                        <div class="slds-m-vertical_medium">
                                            <p class="slds-text-body_regular slds-m-bottom_small">{aprioriSharedStateHint}</p>
                                            <div class="apriori-slider-anchor">
                                                <lightning-slider
                                                    key={aprioriSliderResetKey}
                                                    label="Apriori Score"
                                                    min="0"
                                                    max="1000"
                                                    step="1"
                                                    value={aprioriScore}
                                                    onchange={handleAprioriScoreChange}>
                                                </lightning-slider>
                                                <template lwc:if={showAprioriChangePopover}>
                                                    <section
                                                        aria-describedby="apriori-popover-body"
                                                        aria-label="Update shared apriori score"
                                                        class="slds-popover slds-nubbin_bottom-left apriori-score-popover"
                                                        role="dialog">
                                                        <button
                                                            type="button"
                                                            class="slds-button slds-button_icon slds-button_icon-small slds-float_right slds-popover__close"
                                                            title="Close"
                                                            onclick={handleAprioriPopoverCancel}>
                                                            <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Close"></lightning-icon>
                                                            <span class="slds-assistive-text">Close</span>
                                                        </button>
                                                        <div class="slds-popover__body" id="apriori-popover-body">
                                                            <div class="slds-media">
                                                                <div class="slds-media__body">
                                                                    <p class="slds-text-body_regular">
                                                                        Change the shared apriori score to <strong>{aprioriPopoverPendingScoreLabel}</strong>?
                                                                        This updates all campaigns with the same Topic and Product Family combination.
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <footer class="slds-popover__footer">
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <button
                                                                    type="button"
                                                                    class="slds-button slds-button_neutral"
                                                                    onclick={handleAprioriPopoverCancel}>
                                                                    Cancel
                                                                </button>
                                                                <button
                                                                    type="button"
                                                                    class="slds-button slds-button_brand slds-col_bump-left"
                                                                    onclick={handleAprioriPopoverConfirm}>
                                                                    Confirm
                                                                </button>
                                                            </div>
                                                        </footer>
                                                    </section>
                                                </template>
                                            </div>
                                            <p class="slds-text-body_small slds-m-top_x-small">
                                                Current value: <strong>{summaryAprioriScore}</strong>
                                            </p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- STEP 5: Summary -->
                        <template lwc:if={isStep5}>
                            <div class="form-module-card slds-m-bottom_large">
                                <span class="module-header-title">Campaign Summary</span>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Review all settings before activating. Use Save &amp; Close anytime to keep a draft.</p>

                                <template lwc:if={showSummaryActivationBlocker}>
                                    <div class="summary-activation-banner slds-m-top_small" role="alert">
                                        <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        <span>Activation is blocked until every section below is complete. Fix the items called out in red tiles.</span>
                                    </div>
                                </template>

                                <div class="summary-grid slds-m-top_medium">
                                    <!-- Campaign Properties -->
                                    <div class={basicPropertiesSummaryState.sectionClass}>
                                        <h4 class="summary-section-title">Basic Properties</h4>
                                        <template lwc:if={basicPropertiesSummaryState.issues.length}>
                                            <ul class="summary-validation-list">
                                                <template for:each={basicPropertiesSummaryState.issues} for:item="issue">
                                                    <li key={issue.id}>{issue.message}</li>
                                                </template>
                                            </ul>
                                        </template>
                                        <div class="summary-row">
                                            <span class="summary-label">Campaign Name</span>
                                            <span class="summary-value">{modalTitle}</span>
                                        </div>
                                        <template lwc:if={showCampaignGroup}>
                                            <div class="summary-row">
                                                <span class="summary-label">Campaign Group</span>
                                                <span class="summary-value">{selectedCampaignGroupName}</span>
                                            </div>
                                        </template>
                                        <div class="summary-row">
                                            <span class="summary-label">Active From</span>
                                            <span class="summary-value">{summaryActiveFrom}</span>
                                        </div>
                                        <div class="summary-row">
                                            <span class="summary-label">Active To</span>
                                            <span class="summary-value">{summaryActiveTo}</span>
                                        </div>
                                        <template lwc:if={isAlwaysOnActivation}>
                                            <div class="summary-row">
                                                <span class="summary-label">Campaign Duration (Days)</span>
                                                <span class="summary-value">{summaryCampaignDuration}</span>
                                            </div>
                                        </template>
                                        <div class="summary-row">
                                            <span class="summary-label">Activation Type</span>
                                            <span class="summary-value">{parentActivationType}</span>
                                        </div>
                                        <template lwc:if={isEmergency}>
                                            <div class="summary-row">
                                                <span class="summary-label">Emergency</span>
                                                <span class="summary-value summary-value-highlight">Yes</span>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Priority & Exclusions -->
                                    <div class={prioritySummaryState.sectionClass}>
                                        <h4 class="summary-section-title">Priority &amp; Exclusions</h4>
                                        <template lwc:if={prioritySummaryState.issues.length}>
                                            <ul class="summary-validation-list">
                                                <template for:each={prioritySummaryState.issues} for:item="issue">
                                                    <li key={issue.id}>{issue.message}</li>
                                                </template>
                                            </ul>
                                        </template>
                                        <div class="summary-row">
                                            <span class="summary-label">Priority Tier</span>
                                            <span class="summary-value">{selectedPriorityTier}</span>
                                        </div>
                                        <template lwc:if={summaryExclusionsLabel}>
                                            <div class="summary-row">
                                                <span class="summary-label">Exclusions</span>
                                                <span class="summary-value">{summaryExclusionsLabel}</span>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Channel Selection -->
                                    <div class={channelsSummaryState.sectionClass}>
                                        <h4 class="summary-section-title">Channel Selection</h4>
                                        <template lwc:if={channelsSummaryState.issues.length}>
                                            <ul class="summary-validation-list">
                                                <template for:each={channelsSummaryState.issues} for:item="issue">
                                                    <li key={issue.id}>{issue.message}</li>
                                                </template>
                                            </ul>
                                        </template>
                                        <div class="summary-row">
                                            <span class="summary-label">Channels</span>
                                            <span class="summary-value">{summaryChannels}</span>
                                        </div>
                                    </div>

                                    <!-- Topic & Offering -->
                                    <div class={topicOfferingSummaryState.sectionClass}>
                                        <h4 class="summary-section-title">Topic & Offering</h4>
                                        <template lwc:if={topicOfferingSummaryState.issues.length}>
                                            <ul class="summary-validation-list">
                                                <template for:each={topicOfferingSummaryState.issues} for:item="issue">
                                                    <li key={issue.id}>{issue.message}</li>
                                                </template>
                                            </ul>
                                        </template>
                                        <div class="summary-row">
                                            <span class="summary-label">Topic Name</span>
                                            <span class="summary-value">{topicName}</span>
                                        </div>
                                        <div class="summary-row">
                                            <span class="summary-label">Offering Type</span>
                                            <span class="summary-value">{selectedOfferingType}</span>
                                        </div>
                                        <div class="summary-row">
                                            <span class="summary-label">Selected Items</span>
                                            <span class="summary-value">{summaryOfferingItems}</span>
                                        </div>
                                    </div>

                                    <!-- Channels & Copy -->
                                    <div class={copyAssignmentSummaryState.sectionClass}>
                                        <h4 class="summary-section-title">Channels &amp; Copy</h4>
                                        <template lwc:if={copyAssignmentSummaryState.issues.length}>
                                            <ul class="summary-validation-list">
                                                <template for:each={copyAssignmentSummaryState.issues} for:item="issue">
                                                    <li key={issue.id}>{issue.message}</li>
                                                </template>
                                            </ul>
                                        </template>
                                        <div class="summary-row">
                                            <span class="summary-label">Assigned Copy</span>
                                            <span class="summary-value">{summaryCopyAssignment}</span>
                                        </div>
                                    </div>

                                    <!-- Scoring (tiers 4+ only) -->
                                    <template lwc:if={isScoringStepRequired}>
                                        <div class={scoringSummaryState.sectionClass}>
                                            <h4 class="summary-section-title">Scoring</h4>
                                            <template lwc:if={scoringSummaryState.issues.length}>
                                                <ul class="summary-validation-list">
                                                    <template for:each={scoringSummaryState.issues} for:item="issue">
                                                        <li key={issue.id}>{issue.message}</li>
                                                    </template>
                                                </ul>
                                            </template>
                                            <div class="summary-row">
                                                <span class="summary-label">Scoring Method</span>
                                                <span class="summary-value">{summaryScoringMethod}</span>
                                            </div>
                                            <template lwc:if={isScoringModelConfiguration}>
                                                <div class="summary-row">
                                                    <span class="summary-label">Scoring Model</span>
                                                    <span class="summary-value">{summaryScoringModel}</span>
                                                </div>
                                            </template>
                                            <template lwc:if={isAprioriScoreConfiguration}>
                                                <template lwc:if={showAprioriSummaryChangeAlert}>
                                                    <div class="slds-notify slds-notify_alert slds-alert_warning apriori-summary-alert slds-m-vertical_x-small" role="alert">
                                                        <span class="slds-assistive-text">warning</span>
                                                        <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small apriori-summary-alert-icon"></lightning-icon>
                                                        <h2 class="apriori-summary-alert-text">{aprioriSummaryChangeAlertMessage}</h2>
                                                    </div>
                                                </template>
                                                <div class="summary-row">
                                                    <span class="summary-label">Apriori Score</span>
                                                    <span class="summary-value">{summaryAprioriScore}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- Selected offer panel: only shown when a matching offer was chosen during offering -->
                                <template lwc:if={hasSelectedOfferSummary}>
                                    <div class="offer-summary-block slds-m-top_medium">
                                        <template for:each={selectedOfferSummaries} for:item="offer">
                                            <div key={offer.id} class="summary-section offer-summary-card slds-m-bottom_small">
                                                <div class="offer-summary-header">
                                                    <h4 class="summary-section-title">Selected Offer — {offer.name}</h4>
                                                    <span class="offer-summary-status">{offer.status}</span>
                                                </div>

                                                <template for:each={offer.keyInfo} for:item="info">
                                                    <div key={info.label} class="summary-row">
                                                        <span class="summary-label">{info.label}</span>
                                                        <span class="summary-value">{info.value}</span>
                                                    </div>
                                                </template>

                                                <!-- Attractiveness & properties: collapsed by default -->
                                                <div class={offer.paramsSectionClass}>
                                                    <h5 class="slds-section__title">
                                                        <button type="button"
                                                                class="slds-button slds-section__title-action offer-params-toggle"
                                                                data-id={offer.id}
                                                                onclick={handleToggleOfferParams}>
                                                            <lightning-icon icon-name={offer.paramsChevron}
                                                                            size="x-small"
                                                                            class="slds-m-right_x-small"></lightning-icon>
                                                            <span>Attractiveness &amp; Properties ({offer.paramsCount})</span>
                                                        </button>
                                                    </h5>
                                                    <div class="slds-section__content" aria-hidden={offer.isParamsExpanded}>
                                                        <template lwc:if={offer.isParamsExpanded}>
                                                            <div class="summary-row">
                                                                <span class="summary-label">Attractiveness Score</span>
                                                                <span class="summary-value">{offer.attractivenessScore}</span>
                                                            </div>
                                                            <template for:each={offer.parameters} for:item="param">
                                                                <div key={param.label} class="summary-row">
                                                                    <span class="summary-label">{param.label}</span>
                                                                    <span class="summary-value">{param.value}</span>
                                                                </div>
                                                            </template>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                    </div>

            </div>

            <footer class="custom-modal-footer">
                <div class="footer-left">
                    <button class="pill-action-btn secondary-pill" onclick={handleSwitchToClassic}>Switch to Classic</button>
                </div>
                <div class="footer-right">
                    <button class="pill-action-btn secondary-pill slds-m-right_small" onclick={handleCancel}>Cancel</button>
                    <template lwc:if={showBackButton}>
                        <button class="pill-action-btn secondary-pill slds-m-right_small" onclick={handlePreviousStep}>Back</button>
                    </template>
                    <button class="pill-action-btn secondary-pill slds-m-right_small"
                            onclick={handleSave}
                            title="Save progress and keep working in the wizard.">
                        Save
                    </button>
                    <button class="pill-action-btn secondary-pill slds-m-right_small"
                            onclick={handleSaveAndClose}
                            title="Save progress as a draft campaign and close the wizard.">
                        Save &amp; Close
                    </button>
                    <template lwc:if={showNextButton}>
                        <button class="pill-action-btn primary-pill" onclick={handleNextStep}>Next</button>
                    </template>
                    <template lwc:if={isLastStep}>
                        <button class="pill-action-btn primary-pill"
                                onclick={handleActivate}
                                disabled={isActivationDisabled}
                                title="Activate only when all wizard validations pass.">
                            {activateButtonLabel}
                        </button>
                    </template>
                </div>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation" onclick={handleBackdropClick}></div>
</template>
