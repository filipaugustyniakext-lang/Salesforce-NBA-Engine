<template>
    <lightning-card title="MCE Journeys" icon-name="standard:flow">
        <lightning-button
            slot="actions"
            label="Refresh"
            icon-name="utility:refresh"
            onclick={handleRefresh}
            disabled={isLoading}>
        </lightning-button>
        <div class="slds-p-around_medium">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading journeys" size="small"></lightning-spinner>
            </template>
            <template lwc:else>
                <template lwc:if={error}>
                    <p class="slds-text-color_error slds-m-bottom_small">{error}</p>
                </template>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{message}</p>
                <template lwc:if={contactKeyLabel}>
                    <p class="slds-text-body_small slds-m-bottom_small">External Customer Id: {contactKeyLabel}</p>
                </template>
                <template lwc:if={journeys.length}>
                    <ul class="journey-list">
                        <template for:each={journeys} for:item="row">
                            <li key={row.rowKey} class="slds-box slds-box_x-small slds-m-bottom_x-small journey-card">
                                <div class="journey-card__summary">
                                    <lightning-button-icon
                                        icon-name={row.chevronIcon}
                                        variant="bare"
                                        size="small"
                                        alternative-text={row.expandLabel}
                                        title={row.expandLabel}
                                        data-row-key={row.rowKey}
                                        onclick={handleToggle}>
                                    </lightning-button-icon>
                                    <span class="journey-card__name" title={row.journeyName}>{row.shortName}</span>
                                    <span class={row.statusClass}>{row.status}</span>
                                    <template lwc:if={row.canStop}>
                                        <lightning-button
                                            class="journey-card__stop"
                                            label="Stop"
                                            icon-name="utility:stop"
                                            variant="destructive-text"
                                            data-row-key={row.rowKey}
                                            onclick={handleStop}>
                                        </lightning-button>
                                    </template>
                                </div>
                                <template lwc:if={row.expanded}>
                                    <dl class="journey-card__details">
                                        <div>
                                            <dt>Journey Version</dt>
                                            <dd>{row.versionLabel}</dd>
                                        </div>
                                        <div>
                                            <dt>Latest Activity Name</dt>
                                            <dd>{row.latestActivityName}</dd>
                                        </div>
                                        <div>
                                            <dt>Latest Activity Type</dt>
                                            <dd>{row.latestActivityType}</dd>
                                        </div>
                                        <div>
                                            <dt>Latest Activity Status</dt>
                                            <dd>{row.latestActivityStatus}</dd>
                                        </div>
                                        <div>
                                            <dt>Last Activity Time</dt>
                                            <dd>{row.activityDateLabel}</dd>
                                        </div>
                                        <div>
                                            <dt>Latest Activity ID</dt>
                                            <dd>{row.latestActivityId}</dd>
                                        </div>
                                    </dl>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
