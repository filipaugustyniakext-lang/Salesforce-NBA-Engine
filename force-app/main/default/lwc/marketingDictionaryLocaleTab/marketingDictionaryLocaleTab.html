<template>
    <div class="locale-tab">
        <div class="locale-toolbar slds-m-bottom_small">
            <h2 class="slds-text-heading_small">
                Locales
                <span class="slds-badge slds-badge_lightest slds-m-left_x-small">{localeCount}</span>
            </h2>
            <lightning-button label="Add Locale" icon-name="utility:add" variant="brand" onclick={handleNew}>
            </lightning-button>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
            Locales combine a country code and language code (e.g. <code>pl-PL</code>). Every campaign and Copy Center
            message name includes a locale. The default locale is prefilled and can be changed per item.
        </p>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template lwc:elseif={hasLocales}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th><span class="slds-truncate">Locale</span></th>
                        <th><span class="slds-truncate">Description</span></th>
                        <th class="locale-col-toggle">
                            <div class="locale-th-inline">
                                <span class="slds-truncate">Active</span>
                            </div>
                        </th>
                        <th class="locale-col-toggle">
                            <div class="locale-th-inline">
                                <span class="slds-truncate">Default</span>
                                <lightning-helptext class="slds-m-left_xx-small"
                                    content="Prefilled when campaign and Copy Center message names are generated. Only one locale can be the default.">
                                </lightning-helptext>
                            </div>
                        </th>
                        <th class="locale-col-actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={locales} for:item="loc">
                        <tr key={loc.Id}>
                            <td><span class="slds-text-title_bold">{loc.Name}</span></td>
                            <td>{loc.Topic_Description__c}</td>
                            <td class="locale-col-toggle">
                                <label class="slds-checkbox_toggle">
                                    <span class="slds-assistive-text">Active</span>
                                    <input type="checkbox" role="switch" data-id={loc.Id}
                                        checked={loc.isActive} disabled={isSaving} onchange={handleActiveToggle} />
                                    <span class="slds-checkbox_faux_container">
                                        <span class="slds-checkbox_faux"></span>
                                    </span>
                                </label>
                            </td>
                            <td class="locale-col-toggle">
                                <label class="slds-checkbox_toggle">
                                    <span class="slds-assistive-text">Default</span>
                                    <input type="checkbox" role="switch" class="locale-default-cb" data-id={loc.Id}
                                        checked={loc.isDefault} disabled={loc.defaultDisabled} onchange={handleDefaultToggle} />
                                    <span class="slds-checkbox_faux_container">
                                        <span class="slds-checkbox_faux"></span>
                                    </span>
                                </label>
                            </td>
                            <td class="locale-col-actions">
                                <lightning-button-icon icon-name="utility:edit" variant="border-filled"
                                    size="x-small" alternative-text="Edit" title="Edit"
                                    data-id={loc.Id} onclick={handleEdit} class="slds-m-right_xx-small">
                                </lightning-button-icon>
                                <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                    size="x-small" alternative-text="Delete" title="Delete"
                                    data-id={loc.Id} data-name={loc.Name} onclick={handleDelete}>
                                </lightning-button-icon>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <template lwc:else>
            <p class="slds-text-body_small slds-text-color_weak">No locales defined yet.</p>
        </template>
    </div>

    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="locale-modal-title"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 id="locale-modal-title" class="slds-modal__title">{modalTitle}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        onclick={closeModal} title="Close">
                        <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                    </button>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input label="Country Code" required placeholder="pl"
                                value={editCountryCode} onchange={handleCountryChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <lightning-input label="Language Code" required placeholder="PL"
                                value={editLanguageCode} onchange={handleLanguageChange}>
                            </lightning-input>
                        </div>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                        Locale token: <strong>{editPreview}</strong>
                    </p>
                    <lightning-textarea label="Description (optional)" value={editLocale.Topic_Description__c}
                        onchange={handleDescriptionChange} class="slds-m-top_small">
                    </lightning-textarea>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" class="slds-m-left_x-small"
                        onclick={handleSave} disabled={isSaving}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template lwc:if={isDependencyDialogOpen}>
        <c-marketing-dictionary-dependency-dialog
            report={dependencyReport}
            onclose={handleCloseDependencyDialog}>
        </c-marketing-dictionary-dependency-dialog>
    </template>
</template>
