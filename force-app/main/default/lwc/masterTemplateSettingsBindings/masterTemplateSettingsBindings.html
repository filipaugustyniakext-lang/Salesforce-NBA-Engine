<template>
    <template lwc:if={hasSections}>
        <template for:each={sections} for:item="section">
            <article key={section.key} class={section.cardClass}>
                <div class="slds-card__header">
                    <h2 class="slds-card__header-title settings-binding-card__title">{section.title}</h2>
                </div>
                <div class="slds-card__body slds-card__body_inner">
                    <template lwc:if={section.placeholders.length}>
                        <p class="slds-text-title_caps slds-m-bottom_x-small">Placeholders</p>
                        <div class="settings-binding-card__badges">
                            <template for:each={section.placeholders} for:item="ph">
                                <span key={ph} class="slds-badge slds-badge_lightest">{ph}</span>
                            </template>
                        </div>
                    </template>
                    <template for:each={section.settings} for:item="setting">
                        <section key={setting.key} class="settings-binding-setting slds-m-top_medium">
                            <div class="settings-binding-setting__header">
                                <h3 class="slds-text-heading_small">{setting.label}</h3>
                                <template lwc:if={setting.placeholderLabel}>
                                    <code class="slds-text-body_small slds-m-left_x-small">{setting.placeholderLabel}</code>
                                </template>
                            </div>
                            <template lwc:if={setting.showEnable}>
                                <lightning-input
                                    type="checkbox"
                                    label="Enable in Copy Center"
                                    checked={setting.enabled}
                                    data-path={setting.enablePath}
                                    onchange={handleEnableChange}>
                                </lightning-input>
                            </template>
                            <template lwc:if={setting.isColumnDirection}>
                                <lightning-input
                                    type="checkbox"
                                    label="Enable column direction in Copy Center"
                                    checked={setting.enabled}
                                    data-path="columnDirection"
                                    onchange={handleEnableChange}>
                                </lightning-input>
                                <p class="slds-form-element__label slds-m-top_small">{setting.deviceLabel}</p>
                                <div class="column-layout-picker">
                                    <button type="button" class={setting.ltrClass} data-path={setting.dirPath} data-value="ltr" data-device={setting.device} onclick={handleColumnDirClick}>
                                        <span>Text | Image</span>
                                    </button>
                                    <button type="button" class={setting.rtlClass} data-path={setting.dirPath} data-value="rtl" data-device={setting.device} onclick={handleColumnDirClick}>
                                        <span>Image | Text</span>
                                    </button>
                                    <lightning-button-icon
                                        size="xx-small" icon-name="utility:preview"
                                        alternative-text="Preview column direction"
                                        title="Preview in block panel"
                                        data-preview-kind="columnDirection"
                                        data-preview-value={setting.value}
                                        data-preview-device={setting.device}
                                        onclick={handlePreviewClick}>
                                    </lightning-button-icon>
                                </div>
                            </template>
                            <template lwc:if={setting.isHidePair}>
                                <div class="settings-inline-row slds-m-top_x-small">
                                    <lightning-input type="checkbox" label="Enable hide on desktop" checked={setting.hideDesktopEnabled} data-path={setting.hideDesktopEnablePath} onchange={handleEnableChange}></lightning-input>
                                    <lightning-input type="checkbox" label="Enable hide on mobile" checked={setting.hideMobileEnabled} data-path={setting.hideMobileEnablePath} onchange={handleEnableChange}></lightning-input>
                                </div>
                                <div class="hide-pair-row">
                                    <template lwc:if={setting.hideDesktopEnabled}>
                                        <div class="hide-pair-row__item">
                                            <lightning-radio-group label="View on desktop" name={setting.hideDesktopRadioName} options={setting.visibilityOptions} value={setting.visibilityDesktop} type="button" data-path={setting.hideDesktopPath} onchange={handleHideDefaultChange}></lightning-radio-group>
                                            <lightning-button-icon size="xx-small" icon-name="utility:preview" alternative-text="Preview desktop visibility" data-preview-kind="hideDesktop" data-preview-value={setting.visibilityDesktop} data-column-index={setting.columnIndex} data-content-index={setting.contentIndex} onclick={handlePreviewClick}></lightning-button-icon>
                                        </div>
                                    </template>
                                    <template lwc:if={setting.hideMobileEnabled}>
                                        <div class="hide-pair-row__item">
                                            <lightning-radio-group label="View on mobile" name={setting.hideMobileRadioName} options={setting.visibilityOptions} value={setting.visibilityMobile} type="button" data-path={setting.hideMobilePath} onchange={handleHideDefaultChange}></lightning-radio-group>
                                            <lightning-button-icon size="xx-small" icon-name="utility:preview" alternative-text="Preview mobile visibility" data-preview-kind="hideMobile" data-preview-value={setting.visibilityMobile} data-column-index={setting.columnIndex} data-content-index={setting.contentIndex} onclick={handlePreviewClick}></lightning-button-icon>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template lwc:if={setting.enabled}>
                                <template lwc:if={setting.isHideDefault}>
                                    <div class="block-vis-grid slds-m-top_small">
                                        <lightning-radio-group
                                            label={setting.hideVisibilityLabel}
                                            name={setting.visibilityRadioName}
                                            options={setting.visibilityOptions}
                                            value={setting.visibilityValue}
                                            type="button"
                                            data-setting-key={setting.key}
                                            onchange={handleHideDefaultChange}>
                                        </lightning-radio-group>
                                        <div class="settings-inline-actions">
                                            <lightning-button-icon
                                                size="xx-small" icon-name="utility:preview"
                                                alternative-text="Preview visibility default"
                                                title="Preview in block panel"
                                                data-preview-kind={setting.key}
                                                data-preview-value={setting.previewVisibility}
                                                onclick={handlePreviewClick}>
                                            </lightning-button-icon>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:if={setting.isPadding}>
                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end slds-m-top_small">
                                        <lightning-radio-group
                                            label="Default padding"
                                            name={setting.padDeviceRadioName}
                                            options={setting.padDeviceOptions}
                                            value={setting.padDevice}
                                            type="button"
                                            data-setting-key={setting.key}
                                            onchange={handlePadDeviceChange}>
                                        </lightning-radio-group>
                                        <div class="settings-inline-actions">
                                            <lightning-button-icon
                                                size="xx-small" icon-name="utility:preview"
                                                alternative-text="Preview padding"
                                                title="Temporarily preview in block panel"
                                                data-setting-key={setting.key}
                                                onclick={handlePadPreview}>
                                            </lightning-button-icon>
                                            <lightning-button
                                                variant="base"
                                                label="Set as default"
                                                title="Apply saved padding in block preview"
                                                data-setting-key={setting.key}
                                                onclick={handlePadApplyDefault}>
                                            </lightning-button>
                                        </div>
                                    </div>
                                    <template lwc:if={setting.showPadInherit}>
                                        <lightning-button
                                            variant="base"
                                            label="Inherit from desktop"
                                            title="Copy desktop padding to mobile"
                                            class="slds-m-vertical_x-small"
                                            data-setting-key={setting.key}
                                            data-column-index={setting.columnIndex}
                                            onclick={handlePadInherit}>
                                        </lightning-button>
                                    </template>
                                    <div class="block-spacing-box">
                                        <div class="block-spacing-box__diagram">
                                            <div class="block-spacing-box__side block-spacing-box__side_top">
                                                <input class="slds-input slds-input_xx-small" type="number" min="0" value={setting.activePad.top} data-path={setting.activePadPath} data-side="top" data-column-index={setting.columnIndex} onchange={handlePadChange} disabled={setting.padInputsDisabled} />
                                                <span class="block-spacing-box__unit">px</span>
                                            </div>
                                            <div class="block-spacing-box__middle">
                                                <div class="block-spacing-box__side block-spacing-box__side_left">
                                                    <input class="slds-input slds-input_xx-small" type="number" min="0" value={setting.activePad.left} data-path={setting.activePadPath} data-side="left" data-column-index={setting.columnIndex} onchange={handlePadChange} disabled={setting.padInputsDisabled} />
                                                    <span class="block-spacing-box__unit">px</span>
                                                </div>
                                                <div class="block-spacing-box__core"><span class="block-spacing-box__core-label">Padding</span></div>
                                                <div class="block-spacing-box__side block-spacing-box__side_right">
                                                    <input class="slds-input slds-input_xx-small" type="number" min="0" value={setting.activePad.right} data-path={setting.activePadPath} data-side="right" data-column-index={setting.columnIndex} onchange={handlePadChange} disabled={setting.padInputsDisabled} />
                                                    <span class="block-spacing-box__unit">px</span>
                                                </div>
                                            </div>
                                            <div class="block-spacing-box__side block-spacing-box__side_bottom">
                                                <input class="slds-input slds-input_xx-small" type="number" min="0" value={setting.activePad.bottom} data-path={setting.activePadPath} data-side="bottom" data-column-index={setting.columnIndex} onchange={handlePadChange} disabled={setting.padInputsDisabled} />
                                                <span class="block-spacing-box__unit">px</span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:if={setting.isBackgroundStyle}>
                                    <lightning-radio-group
                                        class="slds-m-top_small"
                                        label="Background style"
                                        name={setting.bgModeRadioName}
                                        options={setting.bgModeOptions}
                                        value={setting.bgMode}
                                        type="button"
                                        data-path={setting.bgModePath}
                                        onchange={handleBgModeChange}>
                                    </lightning-radio-group>
                                </template>
                                <template lwc:if={setting.isBackgroundColor}>
                                    <template for:each={setting.colorRows} for:item="color">
                                        <div key={color.key} class="settings-preset-card">
                                            <div class="settings-preset-card__fields">
                                                <span class="settings-color-swatch" style={color.swatchStyle}></span>
                                                <lightning-input class="settings-preset-card__grow" label="Preset name" value={color.label} data-setting-key={setting.key} data-index={color.index} data-field="label" onchange={handleColorFieldChange}></lightning-input>
                                                <lightning-input class="settings-preset-card__hex" label="HEX" value={color.hex} data-setting-key={setting.key} data-index={color.index} data-field="hex" onchange={handleColorFieldChange}></lightning-input>
                                            </div>
                                            <div class="settings-preset-card__actions">
                                                <lightning-button-icon size="xx-small" icon-name="utility:preview" alternative-text="Preview color" data-preview-kind="bgColor" data-preview-value={color.hex} data-column-index={setting.columnIndex} data-content-index={setting.contentIndex} onclick={handlePreviewClick}></lightning-button-icon>
                                                <template lwc:if={color.showSetDefault}>
                                                    <lightning-button variant="base" label="Set as default" data-setting-key={setting.key} data-hex={color.hex} onclick={handleSetDefaultColor}></lightning-button>
                                                </template>
                                                <lightning-button-icon size="xx-small" icon-name="utility:delete" alternative-text="Delete preset" data-setting-key={setting.key} data-index={color.index} data-kind="color" onclick={handleDeletePreset}></lightning-button-icon>
                                            </div>
                                        </div>
                                    </template>
                                    <lightning-button class="slds-m-top_x-small" label="Add Preset" icon-name="utility:add" data-setting-key={setting.key} onclick={handleAddColor}></lightning-button>
                                </template>
                                <template lwc:if={setting.isBackgroundGradient}>
                                    <template for:each={setting.gradientRows} for:item="gradient">
                                        <div key={gradient.key} class="settings-preset-card">
                                            <lightning-input label="Preset name" value={gradient.label} data-setting-key={setting.key} data-index={gradient.index} data-field="label" onchange={handleGradientFieldChange}></lightning-input>
                                            <lightning-textarea label="Gradient CSS" value={gradient.css} data-setting-key={setting.key} data-index={gradient.index} data-field="css" onchange={handleGradientFieldChange}></lightning-textarea>
                                            <lightning-combobox label="Fallback color" value={gradient.fallbackColor} options={setting.colorOptions} data-setting-key={setting.key} data-index={gradient.index} data-field="fallbackColor" onchange={handleGradientFieldChange}></lightning-combobox>
                                            <div class="settings-preset-card__actions">
                                                <lightning-button-icon size="xx-small" icon-name="utility:preview" alternative-text="Preview gradient" data-preview-kind="bgGradient" data-preview-value={gradient.id} data-column-index={setting.columnIndex} data-content-index={setting.contentIndex} onclick={handlePreviewClick}></lightning-button-icon>
                                                <template lwc:if={gradient.showSetDefault}>
                                                    <lightning-button variant="base" label="Set as default" data-setting-key={setting.key} data-id={gradient.id} onclick={handleSetDefaultGradient}></lightning-button>
                                                </template>
                                                <lightning-button-icon size="xx-small" icon-name="utility:delete" alternative-text="Delete preset" data-setting-key={setting.key} data-index={gradient.index} data-kind="gradient" onclick={handleDeletePreset}></lightning-button-icon>
                                            </div>
                                        </div>
                                    </template>
                                    <lightning-button class="slds-m-top_x-small" label="Add Preset" icon-name="utility:add" data-setting-key={setting.key} onclick={handleAddGradient}></lightning-button>
                                </template>
                                <template lwc:if={setting.isBackgroundImage}>
                                    <template for:each={setting.imageRows} for:item="image">
                                        <div key={image.key} class="settings-preset-card">
                                            <lightning-input label="Preset name" value={image.label} data-setting-key={setting.key} data-index={image.index} data-field="label" onchange={handleImageFieldChange}></lightning-input>
                                            <lightning-combobox label="Fallback color" value={image.fallbackColor} options={setting.colorOptions} data-setting-key={setting.key} data-index={image.index} data-field="fallbackColor" onchange={handleImageFieldChange}></lightning-combobox>
                                            <lightning-radio-group class="slds-m-top_x-small" label="Background image" name={image.deviceRadioName} options={image.deviceOptions} value={image.device} type="button" data-preset-key={image.id} onchange={handleImageDeviceChange}></lightning-radio-group>
                                            <template lwc:if={image.showMobile}>
                                                <lightning-button variant="base" label="Inherit from desktop" class="slds-m-top_xx-small" data-setting-key={setting.key} data-index={image.index} onclick={handleImageInherit}></lightning-button>
                                            </template>
                                            <lightning-input label="Image URL" value={image.activeUrl} data-setting-key={setting.key} data-index={image.index} data-field={image.activeUrlField} onchange={handleImageFieldChange}></lightning-input>
                                            <div class="slds-grid slds-wrap slds-gutters_x-small">
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                                    <lightning-input label="Position" value={image.activePosition} data-setting-key={setting.key} data-index={image.index} data-field={image.activePositionField} onchange={handleImageFieldChange}></lightning-input>
                                                </div>
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                                    <lightning-input label="Size" value={image.activeSize} data-setting-key={setting.key} data-index={image.index} data-field={image.activeSizeField} onchange={handleImageFieldChange}></lightning-input>
                                                </div>
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                                    <lightning-input label="Repeat" value={image.activeRepeat} data-setting-key={setting.key} data-index={image.index} data-field={image.activeRepeatField} onchange={handleImageFieldChange}></lightning-input>
                                                </div>
                                            </div>
                                            <div class="settings-preset-card__actions">
                                                <lightning-button-icon size="xx-small" icon-name="utility:preview" alternative-text="Preview image preset" data-preview-kind="bgImage" data-preview-value={image.id} data-column-index={setting.columnIndex} data-content-index={setting.contentIndex} onclick={handlePreviewClick}></lightning-button-icon>
                                                <template lwc:if={image.showSetDefault}>
                                                    <lightning-button variant="base" label="Set as default" data-setting-key={setting.key} data-id={image.id} onclick={handleSetDefaultImage}></lightning-button>
                                                </template>
                                                <lightning-button-icon size="xx-small" icon-name="utility:delete" alternative-text="Delete preset" data-setting-key={setting.key} data-index={image.index} data-kind="image" onclick={handleDeletePreset}></lightning-button-icon>
                                            </div>
                                        </div>
                                    </template>
                                    <lightning-button class="slds-m-top_x-small" label="Add Preset" icon-name="utility:add" data-setting-key={setting.key} onclick={handleAddImagePreset}></lightning-button>
                                </template>
                            </template>
                        </section>
                    </template>
                </div>
            </article>
        </template>
    </template>
    <template lwc:else>
        <p class="slds-text-body_small slds-text-color_weak">
            No layout tokens detected. Add binding-container, binding-column, and blo-* / col-* placeholders in your HTML.
        </p>
    </template>
</template>
