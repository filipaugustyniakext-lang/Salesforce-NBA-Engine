<template>

    <!-- ── Inline editor view ─────────────────────────────────────────────── -->
    <template lwc:if={isEditorOpen}>
        <c-copy-cockpit-editor
            record-id={_editorRecordId}
            open-schedule-intent={editorOpenScheduleIntent}
            onback={handleEditorBack}
        ></c-copy-cockpit-editor>
    </template>

    <!-- ── List view ─────────────────────────────────────────────────────── -->
    <template lwc:else>
    <div class="cockpit-container">

        <!-- Loading channels -->
        <template lwc:if={isLoading}>
            <div class="cockpit-loading">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Channels error -->
        <template lwc:elseif={hasError}>
            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>

        <!-- No channels -->
        <template lwc:elseif={isEmpty}>
            <div class="cockpit-empty">
                <lightning-icon icon-name="utility:channel_program_levels" size="large" class="slds-m-bottom_small"></lightning-icon>
                <p class="slds-text-heading_small slds-m-bottom_x-small">No channels configured</p>
                <p class="slds-text-body_regular slds-text-color_weak">Add channels in the Marketing Dictionary to see them here.</p>
            </div>
        </template>

        <!-- Main layout -->
        <template lwc:else>
            <div class="ch-layout">

                <!-- Sidebar -->
                <div class="ch-sidebar">
                    <template for:each={channels} for:item="ch">
                        <button
                            key={ch.Id}
                            class={ch.sidebarClass}
                            data-id={ch.Id}
                            data-channeltype={ch.Channel_Type__c}
                            onclick={handleSelectChannel}
                            title={ch.displayName}
                        >
                            <span class="ch-sidebar__icon-wrap">
                                <lightning-icon icon-name={ch.safeIcon} size="x-small"></lightning-icon>
                            </span>
                            <div class="ch-sidebar__name-row">
                                <span class="ch-sidebar__name">{ch.displayName}</span>
                                <span class="ch-sidebar__comm-badges">
                                    <template for:each={ch.commBadges} for:item="badge">
                                        <span key={badge.key} class="slds-badge slds-badge_lightest ch-sidebar__comm-badge">{badge.label}</span>
                                    </template>
                                </span>
                            </div>
                            <span class="ch-sidebar__type">{ch.Channel_Type__c}</span>
                        </button>
                    </template>
                </div>

                <!-- Detail panel -->
                <div class="ch-detail">
                    <template lwc:if={activeChannel}>

                        <!-- Panel header -->
                        <div class="cockpit-panel-header">
                            <div class="cockpit-panel-header__left">
                                <lightning-icon
                                    icon-name={activeChannel.safeIcon}
                                    size="small"
                                    class="slds-m-right_x-small cockpit-panel-icon"
                                ></lightning-icon>
                                <div>
                                    <h2 class="slds-text-heading_small">{activeChannel.displayName}</h2>
                                    <span class="slds-text-body_small slds-text-color_weak">{activeChannel.Channel_Type__c}</span>
                                </div>
                                <div>
                                    <span class="slds-badge">{messageGroupCountLabel}</span>
                                </div>
                            </div>
                            <div class="cockpit-panel-header__right">
                                <lightning-button-group>
                                    <lightning-button
                                    label={syncMCEButtonLabel}
                                    icon-name="utility:sync"
                                    onclick={handleSyncWithMCE}
                                    disabled={isSyncingMCE}
                                ></lightning-button>
                                 <lightning-button
                                    label={syncD360ButtonLabel}
                                    icon-name="utility:data_cloud"
                                    onclick={handleSyncWithD360}
                                    disabled={isSyncingD360}
                                ></lightning-button>
                                </lightning-button-group>
                            </div>
                        </div>

                        <!-- Toolbar -->
                        <div class="cockpit-toolbar">
                            <lightning-input
                                type="search"
                                variant="label-hidden"
                                label="Search messages"
                                placeholder="Search messages..."
                                value={searchTerm}
                                onchange={handleSearch}
                                class="cockpit-search"
                            ></lightning-input>
                            <div class="cockpit-toolbar__right">
                                <lightning-combobox
                                    variant="label-hidden"
                                    value={_statusFilter}
                                    options={statusFilterOptions}
                                    onchange={handleStatusFilterChange}
                                    class="cockpit-status-dropdown"
                                ></lightning-combobox>
                                
                                <lightning-button
                                    label="Add Copy"
                                    icon-name="utility:add"
                                    variant="brand"
                                    onclick={handleAddCopy}
                                ></lightning-button>
                            </div>
                        </div>

                        <!-- Bulk action bar (shown when ≥1 variant selected) -->
                        <template lwc:if={hasSelection}>
                            <div class="cockpit-bulk-bar" role="toolbar" aria-label="Bulk actions">
                                <span class="cockpit-bulk-count">{selectionCountLabel}</span>
                                <div class="cockpit-bulk-actions">
                                    <lightning-button
                                        label="Change Source Template"
                                        icon-name="utility:insert_template"
                                        onclick={handleBulkChangeSourceTemplate}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Sync with MCE"
                                        icon-name="utility:sync"
                                        onclick={handleBulkSyncMCE}
                                        disabled={isSyncingMCE}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Publish"
                                        icon-name="utility:upload"
                                        onclick={handleBulkPublish}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Archive"
                                        icon-name="utility:archive"
                                        onclick={handleBulkArchive}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Delete"
                                        icon-name="utility:delete"
                                        variant="destructive-text"
                                        onclick={handleBulkDeletePrompt}
                                    ></lightning-button>
                                </div>
                                <button class="cockpit-bulk-clear" onclick={handleClearSelection} title="Clear selection">
                                    <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                </button>
                            </div>
                        </template>

                        <!-- Messages loading -->
                        <template lwc:if={isMessagesLoading}>
                            <div class="cockpit-loading">
                                <lightning-spinner alternative-text="Loading messages..." size="small"></lightning-spinner>
                            </div>
                        </template>

                        <!-- Message groups -->
                        <template lwc:elseif={hasGroups}>
                            <div class="cockpit-list-region">
                            <div class="cockpit-list" style={columnWidthStyle} role="list">

                                <!-- Column header -->
                                <div class="cockpit-list-header">
                                    <span class="cockpit-col-check" onclick={handleSelectAllCheckboxClick}>
                                        <input
                                            type="checkbox"
                                            class="cockpit-checkbox cockpit-checkbox_select-all"
                                            data-select-all-variants
                                            checked={allVisibleVariantsSelected}
                                            aria-label={selectAllVisibleLabel}
                                            onchange={handleSelectAllVisible}
                                        />
                                    </span>
                                    <span class="cockpit-col-name">Message / Variant</span>
                                    <span class="cockpit-col-status">Status</span>
                                    <span class="cockpit-col-weight">Weight</span>
                                    <span class="cockpit-col-versions">Versions</span>
                                    <span class="cockpit-col-modified">Last Modified</span>
                                    <span class="cockpit-col-spacer" aria-hidden="true"></span>
                                    <span class="cockpit-col-actions cockpit-col-actions_sticky cockpit-list-header-actions">
                                        <lightning-button-icon
                                            onclick={handleAutoFitColumns}
                                            icon-name="utility:metrics"
                                            size="medium"
                                            label={fitColumnsLabel}
                                            title={fitColumnsLabel}
                                            variant="bare"
                                        ></lightning-button-icon>
                                        <lightning-button-icon 
                                            onclick={handleToggleAll}
                                            icon-name={expandAllIcon}
                                            size="medium"
                                            label={expandAllLabel} 
                                            title={expandAllLabel}
                                            variant="bare"                                       
                                        ></lightning-button-icon>
                                    </span>
                                </div>

                                <template for:each={filteredGroups} for:item="grp">
                                    <div key={grp.messageName} class="cockpit-group" role="listitem">

                                        <!-- Master row -->
                                        <div
                                            class={grp.masterRowClass}
                                            role="button"
                                            tabindex="0"
                                            aria-expanded={grp.expandedStr}
                                            data-name={grp.messageName}
                                            onclick={handleToggleGroup}
                                            onkeydown={handleMasterRowKeydown}
                                            title={grp.expandToggleTitle}
                                        >
                                            <!-- Group checkbox — selects/deselects all variants -->
                                            <div class="cockpit-col-check" onclick={handleMasterCheckboxClick}>
                                                <input
                                                    type="checkbox"
                                                    class="cockpit-checkbox"
                                                    checked={grp.allSelected}
                                                    data-name={grp.messageName}
                                                    aria-label={grp.masterCheckboxLabel}
                                                    onchange={handleGroupSelect}
                                                />
                                            </div>

                                            <span class="cockpit-expand-toggle" aria-hidden="true">
                                                <lightning-icon
                                                    icon-name={grp.chevronIcon}
                                                    size="xx-small"
                                                    class="cockpit-chevron"
                                                ></lightning-icon>
                                            </span>

                                            <div class="cockpit-master-content">
                                                <div class="cockpit-col-name"
                                                    onclick={handleNameCellClick}
                                                    ondblclick={handleGroupNameDblClick}
                                                    data-name={grp.messageName}>
                                                    <span class="cockpit-msg-name" title="Double-click to edit Message Name, Country Code, and Language">{grp.displayName}</span>
                                                    <template lwc:if={grp.language}>
                                                        <span class="cockpit-copy-lang">{grp.language}</span>
                                                    </template>
                                                    <span class="cockpit-master-counts">
                                                        <span class="cockpit-stat-chip">{grp.totalVariants}</span>
                                                    </span>
                                                </div>
                                                <!-- Single status summary on master row (e.g. N Published) -->
                                                <div class="cockpit-col-status">
                                                    <span class={grp.masterStatusSummaryClass}>{grp.masterStatusSummary}</span>
                                                </div>
                                                <div class="cockpit-col-weight"></div>
                                                <div class="cockpit-col-versions"></div>
                                                <div class="cockpit-col-modified"></div>
                                                <div class="cockpit-col-spacer" aria-hidden="true"></div>
                                                <div class="cockpit-col-actions cockpit-col-actions_sticky">
                                                    <lightning-button-icon 
                                                        icon-name="utility:insert_template" 
                                                        variant="border-filled" 
                                                        onclick={handleMasterChangeSourceTemplate} 
                                                        alternative-text="Change Source Template" 
                                                        title="Change Source Template"
                                                        data-name={grp.messageName}
                                                        size="small" >    
                                                    </lightning-button-icon>
                                                    <lightning-button-icon 
                                                        icon-name="utility:settings" 
                                                        variant="border-filled" 
                                                        onclick={handleMasterEdit} 
                                                        alternative-text="Edit Settings" 
                                                        data-name={grp.messageName}
                                                        size="small" >    
                                                    </lightning-button-icon>
                                                     <lightning-button-icon 
                                                        icon-name="utility:delete" 
                                                        variant="border-filled" 
                                                        onclick={handleMasterDelete} 
                                                        alternative-text="Delete Message" 
                                                        data-name={grp.messageName}
                                                        size="small" >    
                                                    </lightning-button-icon>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Variant rows -->
                                        <template lwc:if={grp.isExpanded}>
                                            <div class="cockpit-variants">
                                                <template for:each={grp.variants} for:item="v">
                                                    <div key={v.Id} class={v.variantRowClass} data-variant-row-id={v.Id}>

                                                        <!-- Checkbox -->
                                                        <div class="cockpit-col-check" onclick={handleCheckboxClick}>
                                                            <input
                                                                type="checkbox"
                                                                class="cockpit-checkbox"
                                                                checked={v.isSelected}
                                                                data-id={v.Id}
                                                                aria-label={v.checkboxLabel}
                                                                onchange={handleVariantSelect}
                                                            />
                                                        </div>

                                                        <!-- Indent + name / label -->
                                                        <div class="cockpit-variant-name-cell">
                                                            <span class="slds-badge slds-badge_lightest cockpit-variant-badge" title={v.variantBadgeTitle}>{v.variantBadgeLabel}</span>
                                                            <template lwc:if={v.isVariantSyncing}>
                                                                <lightning-spinner
                                                                    size="xx-small"
                                                                    alternative-text="Syncing with MCE"
                                                                    class="cockpit-variant-sync-spinner">
                                                                </lightning-spinner>
                                                            </template>
                                                            <template lwc:if={v.sourceTemplateBadge}>
                                                                <span
                                                                    class="slds-badge slds-theme_lightest cockpit-source-template-badge"
                                                                    title="Assigned source template"
                                                                >{v.sourceTemplateBadge}</span>
                                                            </template>
                                                            <template lwc:if={v.Subject__c}>
                                                                <span class="cockpit-variant-subject">{v.Subject__c}</span>
                                                            </template>
                                                        </div>

                                                        <!-- Status (dropdown) -->
                                                        <div class="cockpit-col-status cockpit-status-cell">
                                                            <template lwc:if={v.hasSchedule}>
                                                                <button
                                                                    type="button"
                                                                    class={v.scheduleIconClass}
                                                                    title={v.scheduleBadgeTitle}
                                                                    aria-label={v.scheduleBadgeTitle}
                                                                    onclick={handleCheckboxClick}>
                                                                    <lightning-icon
                                                                        icon-name={v.scheduleBadgeIcon}
                                                                        size="xx-small"
                                                                        alternative-text="">
                                                                    </lightning-icon>
                                                                </button>
                                                            </template>
                                                            <div
                                                                class={v.statusPickerClass}
                                                                data-id={v.Id}
                                                                onclick={handleStatusPickerClick}>
                                                                <lightning-button-menu
                                                                    label={v.Status__c}
                                                                    alternative-text={v.statusAriaLabel}
                                                                    variant="bare"
                                                                    icon-size="xx-small"
                                                                    menu-alignment="auto"
                                                                    class="cockpit-status-menu"
                                                                    data-variant-id={v.Id}
                                                                    onopen={handleStatusMenuOpen}
                                                                    onclose={handleStatusMenuClose}
                                                                    onselect={handleVariantStatusChange}>
                                                                    <template for:each={v.statusMenuItems} for:item="opt">
                                                                        <lightning-menu-item
                                                                            key={opt.itemKey}
                                                                            value={opt.value}
                                                                            label={opt.label}>
                                                                        </lightning-menu-item>
                                                                    </template>
                                                                </lightning-button-menu>
                                                            </div>
                                                        </div>

                                                        <!-- Weight: text until click, then compact inline edit (0–100) -->
                                                        <div class="cockpit-col-weight cockpit-weight-cell" onclick={handleCheckboxClick}>
                                                            <template lwc:if={v.weightIsEditing}>
                                                                <input
                                                                    type="text"
                                                                    inputmode="numeric"
                                                                    pattern="[0-9]*"
                                                                    maxlength="3"
                                                                    class="cockpit-weight-input-native"
                                                                    value={weightEditValue}
                                                                    data-id={v.Id}
                                                                    aria-label={v.weightAriaLabel}
                                                                    onclick={handleCheckboxClick}
                                                                    oninput={handleWeightEditInput}
                                                                    onkeydown={handleWeightEditKeydown}
                                                                    onblur={handleWeightEditBlur}
                                                                />
                                                            </template>
                                                            <template lwc:else>
                                                                <button
                                                                    type="button"
                                                                    class="cockpit-weight-display"
                                                                    data-id={v.Id}
                                                                    title="Click to edit weight (0–100)"
                                                                    aria-label={v.weightAriaLabel}
                                                                    onclick={handleWeightDisplayClick}>
                                                                    {v.weightDisplayText}
                                                                </button>
                                                            </template>
                                                        </div>

                                                        <!-- Saved versions count -->
                                                        <div class="cockpit-col-versions">
                                                            <template lwc:if={v.versionCount}>
                                                                <span class="cockpit-num-chip cockpit-num-chip_versions">{v.versionCount}</span>
                                                            </template>
                                                            <template lwc:else>
                                                                <span class="cockpit-stat-none">—</span>
                                                            </template>
                                                        </div>

                                                        <!-- Last Modified -->
                                                        <div class="cockpit-col-modified">
                                                            <template lwc:if={v.lastModifiedFmt}>
                                                                <span class="cockpit-modified-by">{v.lastModifiedBy}</span>
                                                                <span class="cockpit-modified-date">{v.lastModifiedFmt}</span>
                                                            </template>
                                                            <template lwc:else>
                                                                <span class="cockpit-stat-none">—</span>
                                                            </template>
                                                        </div>

                                                        <div class="cockpit-col-spacer" aria-hidden="true"></div>

                                                        <div class="cockpit-col-actions cockpit-col-actions_sticky cockpit-variant-actions">
                                                            <lightning-button-menu
                                                                alternative-text="Variant actions"
                                                                icon-size="x-small"
                                                                menu-alignment="right"
                                                                variant="border-filled"
                                                                class="cockpit-quick-action-menu"
                                                                data-variant-id={v.Id}
                                                                onopen={handleActionsMenuOpen}
                                                                onclose={handleActionsMenuClose}
                                                                onselect={handleVariantOverflowAction}>
                                                                <template for:each={v.variantQuickActionMenuItems} for:item="act">
                                                                    <template lwc:if={act.prefixDivider}>
                                                                        <lightning-menu-divider
                                                                            key={act.menuValueDividerKey}>
                                                                        </lightning-menu-divider>
                                                                    </template>
                                                                    <lightning-menu-item
                                                                        key={act.menuValue}
                                                                        value={act.menuValue}
                                                                        label={act.title}
                                                                        prefix-icon-name={act.icon}
                                                                        disabled={act.isDisabled}
                                                                        class={act.menuItemClass}
                                                                        variant={act.menuItemVariant}>
                                                                    </lightning-menu-item>
                                                                </template>
                                                            </lightning-button-menu>
                                                        </div>

                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                    </div>
                                </template>
                            </div>
                            </div>
                        </template>

                        <!-- Empty state -->
                        <template lwc:elseif={isMessagesEmpty}>
                            <div class="cockpit-channel-empty">
                                <lightning-icon icon-name="utility:chat" size="large" class="slds-m-bottom_small"></lightning-icon>
                                <p class="slds-text-heading_small slds-m-bottom_x-small">No messages yet</p>
                                <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                                    No copy found for <strong>{activeChannel.Name}</strong>. Create the first variant.
                                </p>
                                <lightning-button
                                    label="Add Copy"
                                    icon-name="utility:add"
                                    variant="brand"
                                    onclick={handleAddCopy}
                                ></lightning-button>
                            </div>
                        </template>

                    </template>
                </div>

            </div>
        </template>

    <!-- Add Copy modal -->
    <template lwc:if={isAddModalOpen}>
        <c-copy-cockpit-add-modal
            channel-name={addChannelName}
            channel-type={addChannelType}
            banner-types={addBannerTypes}
            onclose={handleAddModalClose}
            onsave={handleAddModalSave}
        ></c-copy-cockpit-add-modal>
    </template>

    <!-- Status change confirmation (Publish / Archive) -->
    <template lwc:if={isStatusConfirmOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="status-confirm-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_warning slds-theme_alert-texture">
                    <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="status-confirm-title" class="slds-modal__title">{statusConfirmTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{statusConfirmMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleStatusConfirmCancel} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label={statusConfirmProceedLabel} variant="brand" onclick={handleStatusConfirmProceed}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Source template replace confirmation -->
    <template lwc:if={isTemplateReplaceConfirmOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="template-replace-confirm-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_warning slds-theme_alert-texture">
                    <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="template-replace-confirm-title" class="slds-modal__title">Change source template?</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{templateReplaceConfirmMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleTemplateReplaceConfirmCancel} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Change template" variant="brand" onclick={handleTemplateReplaceConfirmProceed}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Delete confirmation modal -->
    <template lwc:if={isDeleteModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="delete-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_error">
                    <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="delete-modal-title" class="slds-modal__title">Delete Variant</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>
                        Permanently delete variant <strong>{deleteTargetVariantLabel}</strong> of
                        <strong> {deleteTargetName}</strong>?
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        This removes the variant from Copy Center and deletes its rows in
                        CC_Message_Metadata__c and CC_Message_Blocks_All__c. This cannot be undone.
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleDeleteCancel} class="slds-m-right_x-small" disabled={isVariantDeleteSaving}></lightning-button>
                    <lightning-button label="Delete" variant="destructive" onclick={handleDeleteConfirm} disabled={isVariantDeleteSaving}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Bulk delete confirmation modal -->
    <template lwc:if={isBulkDeleteModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="bulk-delete-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_error">
                    <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="bulk-delete-modal-title" class="slds-modal__title">Delete {selectionCountLabel}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Permanently delete {selectionCountLabel}?</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        Selected variants and their block data will be removed from
                        CC_Message_Metadata__c and CC_Message_Blocks_All__c. This cannot be undone.
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleBulkDeleteCancel} class="slds-m-right_x-small" disabled={isBulkDeleteSaving}></lightning-button>
                    <lightning-button label="Delete All" variant="destructive" onclick={handleBulkDeleteConfirm} disabled={isBulkDeleteSaving}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Master message delete confirmation -->
    <template lwc:if={isMasterDeleteModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="master-delete-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_error">
                    <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="master-delete-modal-title" class="slds-modal__title">Delete message and all variants</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>
                        Permanently delete <strong>{masterDeleteDisplayName}</strong> and all
                        <strong> {masterDeleteVariantCount}</strong> variant(s)?
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        This removes every variant under this message from Copy Center and deletes related rows in
                        CC_Message_Metadata__c and CC_Message_Blocks_All__c. This cannot be undone.
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleMasterDeleteCancel} class="slds-m-right_x-small" disabled={isMasterDeleteSaving}></lightning-button>
                    <lightning-button label="Delete message" variant="destructive" onclick={handleMasterDeleteConfirm} disabled={isMasterDeleteSaving}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- MCE Sync Warning Modal -->
    <template lwc:if={isSyncModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="sync-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-theme_warning slds-theme_alert-texture">
                    <lightning-icon icon-name="utility:warning" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="sync-modal-title" class="slds-modal__title">Sync Data from MCE</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p><strong>Warning:</strong> Any unsynced edits made here in Salesforce for this channel might be overwritten by data coming from Marketing Cloud if matching variants are found.</p>
                    <p class="slds-m-top_medium">How much data do you want to sync?</p>
                    <ul class="slds-list_dotted slds-m-top_xx-small slds-m-bottom_small">
                        <li><strong>Incremental (Last 15 Mins):</strong> Retrieves only recent changes for a faster update.</li>
                        <li><strong>Full Sync:</strong> Retrieves the entire repository for this channel (may take longer).</li>
                    </ul>
                </div>
                <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                    <lightning-button label="Cancel" onclick={handleSyncCancel}></lightning-button>
                    <div>
                        <lightning-button label="Incremental (Last 15 Mins)" onclick={handleSyncPartialConfirm} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Confirm Full Sync" variant="brand" onclick={handleSyncFullConfirm}></lightning-button>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Clone as new message -->
    <template lwc:if={isCloneMessageModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="clone-message-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-icon icon-name="utility:copy" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="clone-message-modal-title" class="slds-modal__title">Clone as new Message</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small">
                        Create a new message (variant 1) from <strong>{cloneSourceName}</strong>.
                    </p>
                    <lightning-input
                        label="Message name"
                        value={cloneMessageNamePart}
                        required
                        onchange={handleCloneMessageNameChange}>
                    </lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        New record: <strong>{cloneMessageProposedName}</strong>, status Draft.
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloneMessageCancel} class="slds-m-right_x-small" disabled={isCloning}></lightning-button>
                    <lightning-button label="Create Copy" onclick={handleCloneMessageConfirm} class="slds-m-right_x-small" disabled={isCloning}></lightning-button>
                    <lightning-button label="Create Copy &amp; Open Editor" variant="brand" onclick={handleCloneMessageConfirmAndEdit} disabled={isCloning}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Clone confirmation modal -->
    <template lwc:if={isCloneModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="clone-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-icon icon-name="utility:copy" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="clone-modal-title" class="slds-modal__title">Create Copy</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Create a new variant of <strong>{cloneSourceName}</strong>?</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                        New variant will be saved as <strong>{cloneProposedName}</strong> (Variant {cloneProposedVersion}), status Draft.
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloneCancel} class="slds-m-right_x-small" disabled={isCloning}></lightning-button>
                    <lightning-button label="Create Copy" onclick={handleCloneConfirm} class="slds-m-right_x-small" disabled={isCloning}></lightning-button>
                    <lightning-button label="Create Copy &amp; Open Editor" variant="brand" onclick={handleCloneConfirmAndEdit} disabled={isCloning}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Master naming edit modal (Locale = CountryCode-LanguageCode, Message Name) -->
    <template lwc:if={isRenameOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="rename-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleRenameCancel}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 id="rename-modal-title" class="slds-modal__title">Edit Message Name</h2>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                        Name pattern: ChannelPrefix_Locale_MessageName_VariantNumber (Locale = CountryCode-LanguageCode).
                        Channel Prefix and Variant numbers stay fixed. Changes apply to every variant.
                    </p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="cockpit-rename-row">
                        <div class="cockpit-rename-prefix">
                            <span class="slds-form-element__label">Channel Prefix</span>
                            <div class="cockpit-rename-prefix-value">{editingChannelPrefix}</div>
                        </div>
                        <lightning-input
                            label="Country Code"
                            value={editingCountryCode}
                            maxlength="10"
                            required
                            onchange={handleRenameCountryChange}
                            class="cockpit-rename-country"
                        ></lightning-input>
                        <lightning-input
                            label="Message Name"
                            value={editingMessageNamePart}
                            required
                            onchange={handleRenameMessageNameChange}
                            class="cockpit-rename-msg"
                        ></lightning-input>
                    </div>
                    <lightning-combobox
                        label="Language"
                        value={editingLanguage}
                        options={renameLanguageOptions}
                        required
                        onchange={handleRenameLanguageChange}
                        class="slds-m-top_small"
                    ></lightning-combobox>
                    <div class="cockpit-rename-preview slds-m-top_small">
                        <span class="slds-text-body_small slds-text-color_weak">Preview pattern:</span>
                        <code>{renamePreview}</code>
                    </div>
                    <template lwc:if={renameError}>
                        <div class="slds-text-color_error slds-m-top_x-small slds-text-body_small">{renameError}</div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleRenameCancel} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={handleRenameSave}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Master Row Edit modal -->
    <template lwc:if={isMasterEditOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="master-edit-title" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleMasterEditCancel}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <lightning-icon icon-name="utility:settings" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="master-edit-title" class="slds-modal__title">{masterEditModal.messageName}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">

                    <!-- Product Family + Active Offer -->
                    <div class="master-edit-section">
                        <h3 class="master-edit-section__title">Source Product Family &amp; Offer</h3>

                        <!-- Current offer pill -->
                        <template lwc:if={masterEditModal.currentOfferName}>
                            <div class="master-edit-current-offer">
                                <span class="master-edit-current-offer__label">Current offer:</span>
                                <span class="master-edit-current-offer__name">{masterEditModal.currentOfferName}</span>
                            </div>
                        </template>

                        <!-- Family picker -->
                        <template lwc:if={masterEditModal.isLoadingFamilies}>
                            <lightning-spinner size="small" alternative-text="Loading product families..."></lightning-spinner>
                        </template>
                        <template lwc:else>
                            <lightning-combobox
                                label="Product Family"
                                placeholder="Select a product family..."
                                value={masterEditModal.productFamilyId}
                                options={masterEditFamilyOptions}
                                onchange={handleMasterEditFamilyChange}
                            ></lightning-combobox>
                        </template>

                        <!-- Offer picker (shown after family selected) -->
                        <template lwc:if={masterEditModal.productFamilyId}>
                            <div class="slds-m-top_small">
                                <template lwc:if={masterEditModal.isLoadingOffers}>
                                    <lightning-spinner size="small" alternative-text="Loading offers..."></lightning-spinner>
                                </template>
                                <template lwc:else>
                                    <lightning-combobox
                                        label="Active Offer"
                                        placeholder="Select an active offer..."
                                        value={masterEditModal.offerId}
                                        options={masterEditOfferOptions}
                                        disabled={masterEditNoOffers}
                                        onchange={handleMasterEditOfferChange}
                                    ></lightning-combobox>
                                    <template lwc:if={masterEditNoOffers}>
                                        <p class="master-edit-no-offers">No active offers found for this product family.</p>
                                    </template>
                                </template>
                            </div>
                        </template>
                    </div>

                    <div class="master-edit-section slds-m-top_large">
                        <h3 class="master-edit-section__title">Source Template</h3>
                        <template lwc:if={masterEditModal.currentSourceTemplateName}>
                            <div class="master-edit-current-offer slds-m-bottom_x-small">
                                <span class="master-edit-current-offer__label">Current template:</span>
                                <span class="master-edit-current-offer__name">{masterEditModal.currentSourceTemplateName}</span>
                            </div>
                        </template>
                        <template lwc:if={selectableTemplatesLoading}>
                            <lightning-spinner size="small" alternative-text="Loading templates..."></lightning-spinner>
                        </template>
                        <template lwc:else>
                            <lightning-combobox
                                label="Source Template"
                                placeholder="Select a validated template..."
                                value={masterEditModal.sourceTemplateId}
                                options={selectableTemplateOptions}
                                field-level-help="Active, validated templates from Marketing Dictionary → Channels → Templates. Applies to all variants in this master row when you save settings."
                                onchange={handleMasterEditSourceTemplateChange}
                            ></lightning-combobox>
                        </template>
                    </div>

                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleMasterEditCancel} class="slds-m-right_x-small" disabled={masterEditModal.isSaving}></lightning-button>
                    <lightning-button label="Save Settings" variant="brand" onclick={handleMasterEditSave} disabled={masterEditModal.isSaving}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Change Source Template modal (bulk / variant / master quick action) -->
    <template lwc:if={isSourceTemplateModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="source-template-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleSourceTemplateModalCancel}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <lightning-icon icon-name="utility:insert_template" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <h2 id="source-template-modal-title" class="slds-modal__title">{sourceTemplateModal.title}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-text-body_regular slds-m-bottom_medium">{sourceTemplateModal.subtitle}</p>
                    <template lwc:if={selectableTemplatesLoading}>
                        <lightning-spinner size="small" alternative-text="Loading templates..."></lightning-spinner>
                    </template>
                    <template lwc:else>
                        <lightning-combobox
                            label="Source Template"
                            placeholder="Select a validated template..."
                            value={sourceTemplateModal.selectedTemplateId}
                            options={selectableTemplateOptions}
                            required
                            field-level-help="Templates are managed under Marketing Dictionary → Channels → Templates (active and validated only)."
                            onchange={handleSourceTemplateModalChange}
                        ></lightning-combobox>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleSourceTemplateModalCancel} class="slds-m-right_x-small" disabled={sourceTemplateModal.isSaving}></lightning-button>
                    <lightning-button label="Apply Template" variant="brand" onclick={handleSourceTemplateModalSave} disabled={sourceTemplateModal.isSaving}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    </div>
    </template><!-- end lwc:else list view -->

</template>
